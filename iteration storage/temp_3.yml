  # ===================================================================
  #  SECURITY
  # ===================================================================
  - title: Security
    path: security
    icon: mdi:shield-lock
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(12, 1fr)
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
    cards:
      # Posture chips
      - type: custom:mushroom-chips-card
        alignment: justify
        chips:
          - type: template
            icon: mdi:shield-star
            content: >
              {% set crit = states('sensor.wazuh_critical_24h')|int(0) %}
              {% set high = states('sensor.wazuh_high_24h')|int(0) %}
              {% set alarm = states('alarm_control_panel.alarm') %}
              {% set nas_warn = is_state('binary_sensor.synology_security_status', 'on') %}
              {% if crit > 0 or nas_warn %}
                Posture: Critical
              {% elif high > 0 or alarm == 'disarmed' %}
                Posture: Warning
              {% else %}
                Posture: Good
              {% endif %}
            icon_color: >
              {% set crit = states('sensor.wazuh_critical_24h')|int(0) %}
              {% set high = states('sensor.wazuh_high_24h')|int(0) %}
              {% set alarm = states('alarm_control_panel.alarm') %}
              {% set nas_warn = is_state('binary_sensor.synology_security_status', 'on') %}
              {% if crit > 0 or nas_warn %}
                red
              {% elif high > 0 or alarm == 'disarmed' %}
                amber
              {% else %}
                green
              {% endif %}
            tap_action:
              action: more-info
              entity: sensor.siem_security_score
          - type: template
            icon: mdi:shield-home
            content: Alarm {{ states('alarm_control_panel.alarm') }}
            icon_color: >
              {% if is_state('alarm_control_panel.alarm', 'disarmed') %}red{%
              else %}green{% endif %}
            tap_action:
              action: more-info
              entity: alarm_control_panel.alarm
          - type: template
            icon: mdi:shield-check
            content: SIEM {{ states('sensor.siem_security_score') }}
            icon_color: blue
            tap_action:
              action: more-info
              entity: sensor.siem_security_score
          - type: template
            icon: mdi:alert-octagon
            content: Crit {{ states('sensor.wazuh_critical_24h') }}
            icon_color: >
              {% if states('sensor.wazuh_critical_24h')|int(0) > 0 %}red{% else
              %}green{% endif %}
            tap_action:
              action: more-info
              entity: sensor.wazuh_critical_24h
          - type: template
            icon: mdi:alert
            content: High {{ states('sensor.wazuh_high_24h') }}
            icon_color: >
              {% if states('sensor.wazuh_high_24h')|int(0) > 0 %}amber{% else
              %}green{% endif %}
            tap_action:
              action: more-info
              entity: sensor.wazuh_high_24h
          - type: template
            icon: mdi:nas
            content: >
              {% if is_state('binary_sensor.synology_security_status', 'on') %}
                NAS warning
              {% else %}
                NAS OK
              {% endif %}
            icon_color: >
              {% if is_state('binary_sensor.synology_security_status', 'on') %}
                red
              {% else %}
                green
              {% endif %}
            tap_action:
              action: more-info
              entity: binary_sensor.synology_security_status
        card_mod:
          style: |
            ha-card {
              border-radius: 22px;
              border: 1px solid rgba(180, 190, 254, 0.18);
              box-shadow: none;
              padding: 10px;
            }
            mushroom-template-chip, mushroom-entity-chip {
              margin: 2px !important;
            }
