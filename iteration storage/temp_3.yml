      # K8s cluster
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-title-card
            title: K8s Cluster
            subtitle: >
              {{ states('sensor.homelab_nodes_count') }} nodes •
              {{ states('sensor.homelab_pods_count') }} pods
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Node ready status
                secondary: >
                  {% set bad = namespace(nodes=[]) %}
                  {% for n in [1,2,3,4,5] %}
                    {% set mem = 'binary_sensor.homelab_k8s_' ~ n ~ '_memory_pressure' %}
                    {% set dsk = 'binary_sensor.homelab_k8s_' ~ n ~ '_disk_pressure' %}
                    {% set pid = 'binary_sensor.homelab_k8s_' ~ n ~ '_pid_pressure' %}
                    {% set net = 'binary_sensor.homelab_k8s_' ~ n ~ '_network_unavailable' %}
                    {% if is_state(mem,'on') or is_state(dsk,'on') or is_state(pid,'on') or is_state(net,'on') %}
                      {% set bad.nodes = bad.nodes + ['k8s-' ~ n] %}
                    {% endif %}
                  {% endfor %}
                  {% if bad.nodes | length == 0 %}All 5 nodes ready{% else %}Not ready: {{ bad.nodes | join(', ') }}{% endif %}
                icon: mdi:server-network
                icon_color: >
                  {% set bad = namespace(found=false) %}
                  {% for n in [1,2,3,4,5] %}
                    {% if is_state('binary_sensor.homelab_k8s_' ~ n ~ '_memory_pressure','on')
                      or is_state('binary_sensor.homelab_k8s_' ~ n ~ '_disk_pressure','on')
                      or is_state('binary_sensor.homelab_k8s_' ~ n ~ '_pid_pressure','on')
                      or is_state('binary_sensor.homelab_k8s_' ~ n ~ '_network_unavailable','on') %}
                      {% set bad.found = true %}
                    {% endif %}
                  {% endfor %}
                  {{ 'red' if bad.found else 'green' }}
                tap_action:
                  action: more-info
                  entity: binary_sensor.homelab_cluster_health
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-entity-card
                entity: binary_sensor.homelab_cluster_health
                name: Cluster health
                icon: mdi:kubernetes
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-entity-card
                entity: sensor.homelab_pods_count
                name: Pods
                icon: mdi:cube-outline
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-entity-card
                entity: sensor.homelab_deployments_count
                name: Deployments
                icon: mdi:application-cog
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-entity-card
