# =====================================================================
#  Home dashboard — rebuilt from scratch (2026)
#  Views: Overview · Home · Energy · Car · Security · Homelab · Health
#  Design language: Catppuccin-inspired, 22px radius, subtle borders,
#  Mushroom + button-card + ApexCharts + power-flow-card-plus.
#  New hardware highlighted: Peugeot 508 SW (PHEV) + Alfen EV charger.
# =====================================================================
title: Home
decluttering_templates:
  # Small square action tile (toggle helpers, scenes, quick presses)
  quick_button:
    card:
      type: custom:button-card
      entity: '[[entity]]'
      name: '[[name]]'
      icon: '[[icon]]'
      tap_action:
        action: '[[action]]'
      show_state: false
      styles:
        card:
          - border-radius: 16px
          - padding: 10px 12px
          - height: 64px
        icon:
          - width: 20px
        name:
          - font-size: 13px
          - font-weight: 600
  # Command tile that fires a service (e.g. button.press for the car)
  command_button:
    card:
      type: custom:button-card
      entity: '[[entity]]'
      name: '[[name]]'
      icon: '[[icon]]'
      tap_action:
        action: call-service
        service: '[[service]]'
        target:
          entity_id: '[[entity]]'
      show_state: false
      styles:
        card:
          - border-radius: 16px
          - padding: 10px 12px
          - height: 64px
        icon:
          - width: 20px
        name:
          - font-size: 12px
          - font-weight: 600

views:
  # ===================================================================
  #  OVERVIEW
  # ===================================================================
  - title: Overview
    path: overview
    icon: mdi:view-dashboard
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(12, 1fr)
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
    cards:
      # Greeting banner
      - type: markdown
        content: >
          ## {% set h = now().hour %}{% if h < 6 %}Good night{% elif h < 12
          %}Good morning{% elif h < 18 %}Good afternoon{% else %}Good evening{%
          endif %} 👋

          {{ now().strftime('%A %-d %B') }} · {{
          states('weather.forecast_home') | capitalize }} · {{
          state_attr('weather.forecast_home','temperature') }}°
        card_mod:
          style: |
            ha-card {
              background: rgba(var(--rgb-card-background-color), 0.72);
              border: 1px solid rgba(180, 190, 254, 0.18);
              border-radius: 22px;
              box-shadow: none;
              padding: 2px 14px;
            }
        view_layout:
          grid-column: 1 / 13

      # At-a-glance status chips
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - icon: mdi:home-account
            type: template
            content: >
              {% if is_state('group.persons', 'home') %}Home{% else %}Away{%
              endif %}
            icon_color: >
              {% if is_state('group.persons', 'home') %}green{% else %}amber{%
              endif %}
            tap_action:
              action: more-info
              entity: group.persons
          - icon: mdi:shield-home
            type: template
            tap_action:
              entity: alarm_control_panel.alarm
              action: more-info
            content: |
              {% if is_state('alarm_control_panel.alarm', 'armed_away')
                    or is_state('alarm_control_panel.alarm', 'armed_home')
                    or is_state('alarm_control_panel.alarm', 'armed_night') %}
                Armed
              {% else %}
                Disarmed
              {% endif %}
            icon_color: |
              {% if is_state('alarm_control_panel.alarm', 'armed_away')
                    or is_state('alarm_control_panel.alarm', 'armed_home')
                    or is_state('alarm_control_panel.alarm', 'armed_night') %}
                green
              {% else %}
                red
              {% endif %}
          - icon: mdi:lock
            type: template
            tap_action:
              entity: lock.elite
              action: more-info
            content: >
              {% if is_state('lock.elite', 'locked') %}Locked{% else
              %}Unlocked{% endif %}
            icon_color: >
              {% if is_state('lock.elite', 'locked') %}green{% else %}red{%
              endif %}
          - icon: mdi:solar-power
            type: template
            tap_action:
              entity: sensor.inverter_total_power
              action: more-info
            content: '{{ states(''sensor.inverter_total_power'') }} W'
            icon_color: yellow
          - icon: mdi:car-electric
            type: template
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/car
            content: >
              {{ states('sensor.oprit_508_sw_battery') }}% · {{
              states('sensor.oprit_508_sw_autonomy') }}
            icon_color: >
              {% if is_state('binary_sensor.oprit_508_sw_battery_charging',
              'on') %}blue{% elif
              states('sensor.oprit_508_sw_battery')|int(0) < 20 %}red{% else
              %}green{% endif %}
          - icon: mdi:download-network
            type: template
            content: >
              {{ states('sensor.speedtest_download')|round(0) }} / {{
              states('sensor.speedtest_upload')|round(0) }}
            icon_color: blue
          - icon: mdi:update
            type: template
            content: |
              {% set updates = expand(states.update)
                | selectattr('state', 'eq', 'on') | list %}
              {{ updates | count }} updates
            icon_color: >
              {% set updates = expand(states.update)
                | selectattr('state', 'eq', 'on') | list %}
              {{ 'amber' if updates | count > 0 else 'green' }}
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/homelab
        card_mod:
          style: |
            ha-card {
              border-radius: 22px;
              border: 1px solid rgba(180, 190, 254, 0.18);
              box-shadow: none;
              padding: 10px;
            }
            mushroom-template-chip, mushroom-entity-chip {
              margin: 2px !important;
            }
        view_layout:
          grid-column: 1 / 13

      # Category navigation tiles
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:button-card
            entity: alarm_control_panel.alarm
            name: Security
            icon: mdi:shield-home
            show_state: true
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/security
            styles:
              card:
                - border-radius: 22px
                - padding: 18px 12px
                - border: 1px solid rgba(180, 190, 254, 0.18)
              icon:
                - width: 34px
              name:
                - font-size: 17px
                - font-weight: 600
              state:
                - font-size: 14px
            state:
              - value: disarmed
                color: rgb(243, 139, 168)
              - value: armed_home
                color: rgb(166, 227, 161)
              - value: armed_away
                color: rgb(137, 180, 250)
              - value: armed_night
                color: rgb(203, 166, 247)
          - type: custom:button-card
            entity: input_boolean.current_light_state
            name: Home
            icon: mdi:sofa
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/home
            styles:
              card:
                - border-radius: 22px
                - padding: 18px 12px
                - border: 1px solid rgba(180, 190, 254, 0.18)
              icon:
                - width: 34px
              name:
                - font-size: 17px
                - font-weight: 600
            color: rgb(203, 166, 247)
          - type: custom:button-card
            entity: sensor.inverter_total_power
            name: Energy
            icon: mdi:lightning-bolt
            show_state: true
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/energy
            styles:
              card:
                - border-radius: 22px
                - padding: 18px 12px
                - border: 1px solid rgba(180, 190, 254, 0.18)
              icon:
                - width: 34px
              name:
                - font-size: 17px
                - font-weight: 600
              state:
                - font-size: 14px
            color: rgb(245, 224, 94)
          - type: custom:button-card
            entity: sensor.oprit_508_sw_battery
            name: Car
            icon: mdi:car-electric
            show_state: true
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/car
            state_display: >
              [[[ return `${states['sensor.oprit_508_sw_battery']?.state ??
              '-'}% · ${states['sensor.oprit_508_sw_autonomy']?.state ??
              '-'}`; ]]]
            styles:
              card:
                - border-radius: 22px
                - padding: 18px 12px
                - border: 1px solid rgba(180, 190, 254, 0.18)
              icon:
                - width: 34px
              name:
                - font-size: 17px
                - font-weight: 600
              state:
                - font-size: 13px
            color: rgb(137, 180, 250)
        view_layout:
          grid-column: 1 / 13

      # Who's home
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-title-card
            title: Who's home
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: person.eduward_post
                primary: Eduward
                secondary: '{{ states(''person.eduward_post'') }}'
                icon: mdi:account
                icon_color: >
                  {% if is_state('person.eduward_post', 'home') %}green{% else
                  %}grey{% endif %}
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-template-card
                entity: person.regina_post
                primary: Regina
                secondary: '{{ states(''person.regina_post'') }}'
                icon: mdi:account
                icon_color: >
                  {% if is_state('person.regina_post', 'home') %}green{% else
                  %}grey{% endif %}
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-template-card
                entity: person.albert_post
                primary: Albert
                secondary: '{{ states(''person.albert_post'') }}'
                icon: mdi:account
                icon_color: >
                  {% if is_state('person.albert_post', 'home') %}green{% else
                  %}grey{% endif %}
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-template-card
                entity: person.johanna_post
                primary: Johanna
                secondary: '{{ states(''person.johanna_post'') }}'
                icon: mdi:account
                icon_color: >
                  {% if is_state('person.johanna_post', 'home') %}green{% else
                  %}grey{% endif %}
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; border: 0px; box-shadow: none; }
        card_mod:
          style: |
            ha-card {
              border-radius: 22px;
              border: 1px solid rgba(180, 190, 254, 0.18);
              box-shadow: none;
            }
        view_layout:
          grid-column: 1 / 13

      # Weather + calendar + waste collection
      - type: grid
        columns: 3
        square: false
        cards:
          - show_current: true
            show_forecast: true
            type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
          - type: custom:calendar-card-pro
            entities:
              - calendar.afvalinfo_thuis_calendar
              - calendar.kyokushin_karate
              - calendar.persoonlijk
          - type: entities
            title: Waste collection
            entities:
              - entity: sensor.afvalinfo_thuis_trash_type_today
              - entity: sensor.afvalinfo_thuis_trash_type_tomorrow
              - entity: sensor.afvalinfo_thuis_restafval_2
              - entity: sensor.afvalinfo_thuis_papier_2
              - entity: sensor.afvalinfo_thuis_gft
        view_layout:
          grid-column: 1 / 13

      # Live power trend + quick actions + requires attention
      - type: grid
        columns: 3
        square: false
        cards:
          - type: grid
            title: Live power trend
            columns: 1
            square: false
            cards:
              - type: custom:apexcharts-card
                header:
                  show: true
                  show_states: true
                  colorize_states: true
                graph_span: 12h
                now:
                  show: true
                series:
                  - entity: sensor.inverter_total_power
                    transform: 'return x / 1000;'
                    name: Solar
                    type: line
                    group_by:
                      func: avg
                      duration: 5min
                  - entity: sensor.electricity_meter_power_consumption
                    name: Import
                    type: line
                    group_by:
                      func: avg
                      duration: 5min
                  - entity: sensor.electricity_meter_power_production
                    name: Export
                    type: line
                    group_by:
                      func: avg
                      duration: 5min
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 22px;
                      border: 1px solid rgba(180, 190, 254, 0.18);
                      box-shadow: none;
                    }
          - type: grid
            title: Quick actions
            columns: 2
            square: false
            cards:
              - type: custom:decluttering-card
                template: quick_button
                variables:
                  - entity: input_boolean.start_ha_morning
                  - name: Morning
                  - icon: mdi:weather-sunset-up
                  - action: toggle
              - type: custom:decluttering-card
                template: quick_button
                variables:
                  - entity: input_boolean.start_ha_night_routine
                  - name: Night
                  - icon: mdi:weather-night
                  - action: toggle
              - type: custom:button-card
                entity: vacuum.roombot
                name: Start vacuum
                icon: mdi:robot-vacuum
                tap_action:
                  action: call-service
                  service: vacuum.start
                  target:
                    entity_id: vacuum.roombot
                show_state: false
                styles:
                  card:
                    - border-radius: 16px
                    - padding: 10px 12px
                    - height: 64px
                  icon:
                    - width: 20px
                  name:
                    - font-size: 13px
                    - font-weight: 600
              - type: custom:button-card
                entity: input_button.run_speedtest
                name: Run speedtest
                icon: mdi:speedometer
                tap_action:
                  action: call-service
                  service: input_button.press
                  target:
                    entity_id: input_button.run_speedtest
                show_state: false
                styles:
                  card:
                    - border-radius: 16px
                    - padding: 10px 12px
                    - height: 64px
                  icon:
                    - width: 20px
                  name:
                    - font-size: 13px
                    - font-weight: 600
          - type: custom:auto-entities
            card:
              type: grid
              title: Requires attention
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - entity_id: binary_sensor.*low_battery*
                  state: 'on'
                  options:
                    type: custom:button-card
                    entity: this.entity_id
                    icon: mdi:battery-alert
                    show_name: true
                    show_state: true
                    tap_action:
                      action: more-info
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 10px 12px
                        - height: 70px
                        - border-width: 1px
                        - border-style: solid
                        - border-color: rgba(220, 70, 70, 0.60)
                      name:
                        - font-size: 12px
                        - font-weight: 600
                      state:
                        - font-size: 10px
                        - opacity: 0.75
                      icon:
                        - color: rgb(220, 70, 70)
                - entity_id: binary_sensor.*replace_battery*
                  state: 'on'
                  options:
                    type: custom:button-card
                    entity: this.entity_id
                    icon: mdi:battery-alert-variant-outline
                    show_name: true
                    show_state: true
                    tap_action:
                      action: more-info
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 10px 12px
                        - height: 70px
                        - border-width: 1px
                        - border-style: solid
                        - border-color: rgba(220, 70, 70, 0.60)
                      name:
                        - font-size: 12px
                        - font-weight: 600
                      state:
                        - font-size: 10px
                        - opacity: 0.75
                      icon:
                        - color: rgb(220, 70, 70)
                - entity_id: binary_sensor.*tamper*
                  state: 'on'
                  options:
                    type: custom:button-card
                    entity: this.entity_id
                    icon: mdi:shield-alert
                    show_name: true
                    show_state: true
                    tap_action:
                      action: more-info
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 10px 12px
                        - height: 70px
                        - border-width: 1px
                        - border-style: solid
                        - border-color: rgba(220, 70, 70, 0.60)
                      name:
                        - font-size: 12px
                        - font-weight: 600
                      state:
                        - font-size: 10px
                        - opacity: 0.75
                      icon:
                        - color: rgb(220, 70, 70)
                - entity_id: binary_sensor.*over_load*
                  state: 'on'
                  options:
                    type: custom:button-card
                    entity: this.entity_id
                    icon: mdi:flash-alert
                    show_name: true
                    show_state: true
                    tap_action:
                      action: more-info
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 10px 12px
                        - height: 70px
                        - border-width: 1px
                        - border-style: solid
                        - border-color: rgba(220, 70, 70, 0.60)
                      name:
                        - font-size: 12px
                        - font-weight: 600
                      state:
                        - font-size: 10px
                        - opacity: 0.75
                      icon:
                        - color: rgb(220, 70, 70)
                - entity_id: binary_sensor.*warnings
                  state: 'on'
                  options:
                    type: custom:button-card
                    entity: this.entity_id
                    icon: mdi:alert
                    show_name: true
                    show_state: true
                    tap_action:
                      action: more-info
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 10px 12px
                        - height: 70px
                        - border-width: 1px
                        - border-style: solid
                        - border-color: rgba(220, 70, 70, 0.60)
                      name:
                        - font-size: 12px
                        - font-weight: 600
                      state:
                        - font-size: 10px
                        - opacity: 0.75
                      icon:
                        - color: rgb(220, 70, 70)
                - domain: update
                  state: 'on'
                  options:
                    type: custom:button-card
                    entity: this.entity_id
                    icon: mdi:update
                    show_name: true
                    show_state: true
                    tap_action:
                      action: more-info
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 10px 12px
                        - height: 70px
                        - border-width: 1px
                        - border-style: solid
                        - border-color: rgba(220, 160, 60, 0.55)
                      name:
                        - font-size: 12px
                        - font-weight: 600
                      state:
                        - font-size: 10px
                        - opacity: 0.75
                      icon:
                        - color: rgb(220, 160, 60)
              exclude: []
            sort:
              method: friendly_name
            show_empty: false
        view_layout:
          grid-column: 1 / 13

  # ===================================================================
  #  HOME
  # ===================================================================
  - title: Home
    path: home
    icon: mdi:sofa
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(12, 1fr)
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
    cards:
      # Lights
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-title-card
            title: Lights
            subtitle: Tap to toggle, hold for controls
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-light-card
                entity: light.downstairs
                name: Downstairs
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.living_room_lights
                name: Living room
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.kitchen_lights
                name: Kitchen
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.eetkamer
                name: Dining
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.schilderij
                name: Paintings
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.hal
                name: Hall
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.kantoor
                name: Office
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.keuken_boven
                name: Kitchen upper
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.slaapkamer_plafond
                name: Bedroom
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.buiten_lampen_oprit
                name: Driveway
                show_brightness_control: false
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.buiten_lampen_garage
                name: Garage outside
                show_brightness_control: false
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.buiten_stekker
                name: Outside plug
                show_brightness_control: false
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
        card_mod:
          style: |
            ha-card {
              border-radius: 22px;
              border: 1px solid rgba(180, 190, 254, 0.18);
              box-shadow: none;
            }
        view_layout:
          grid-column: 1 / 7

      # Climate / indoor conditions
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-title-card
            title: Climate
            subtitle: Indoor conditions
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.tempature_sensor_temperature
                name: Living temp
                icon: mdi:thermometer
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-entity-card
                entity: sensor.tempature_sensor_humidity
                name: Living humidity
                icon: mdi:water-percent
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-entity-card
                entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_temperature
                name: Bedroom temp
                icon: mdi:thermometer-lines
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-entity-card
                entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_carbon_dioxide
                name: Bedroom CO₂
                icon: mdi:molecule-co2
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-entity-card
