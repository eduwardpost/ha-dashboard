      # Service latency chart
      - type: custom:apexcharts-card
        header:
          show: true
          title: Service latency (12h)
          show_states: true
          colorize_states: true
        graph_span: 12h
        series:
          - entity: sensor.home_assistant_response_time
            name: HA
            group_by:
              func: avg
              duration: 15min
          - entity: sensor.postgres_response_time
