          style: |
            ha-card {
              border-radius: 22px;
              border: 1px solid rgba(180, 190, 254, 0.18);
              box-shadow: none;
              padding: 8px;
            }
        view_layout:
          grid-column: 1 / 13

      # Today chart + power flow
      - type: custom:apexcharts-card
        header:
          show: true
          title: Today
          show_states: true
          colorize_states: true
        graph_span: 24h
        series:
          - entity: sensor.inverter_total_power
            transform: 'return x / 1000;'
            name: Solar
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.electricity_meter_power_consumption
            name: Import
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.electricity_meter_power_production
            name: Export
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.alfen_jk_real_power_sum
            transform: 'return x / 1000;'
            name: EV charger
            group_by:
              func: avg
              duration: 10min
        card_mod:
          style: |
            ha-card {
              border-radius: 22px;
              border: 1px solid rgba(180, 190, 254, 0.18);
              box-shadow: none;
            }
        view_layout:
          grid-column: 1 / 9

      - type: custom:power-flow-card-plus
