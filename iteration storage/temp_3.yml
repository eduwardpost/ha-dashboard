          grid-column: 9 / 13
        entities:
          battery:
            color_icon: true
            color_circle: true
            state_of_charge: sensor.ups_battery_charge
            invert_state: false
            use_metadata: false
          grid:
            entity:
              consumption: sensor.electricity_meter_power_consumption
              production: sensor.electricity_meter_power_production
            color_circle: true
            display_state: two_way
            color_value: true
            color_icon: true
          fossil_fuel_percentage:
            entity: sensor.co2_signal_grid_fossil_fuel_percentage
            color_value: false
            color_icon: true
            state_type: percentage
          home:
            color_icon: true
          individual:
            - entity: sensor.alfen_jk_real_power_sum
              name: EV charger
              icon: mdi:ev-station
              color_icon: true
              calculate_flow_rate: true
              color:
                - 137
                - 180
                - 250
            - entity: sensor.zolder_power_switch_power_2
              name: Servers
              color_icon: true
              icon: mdi:server
              calculate_flow_rate: true
              color_value: false
              color:
                - 255
                - 38
                - 0
            - entity: sensor.meterkast_power_switch_electric_consumption_w
              name: Network
              icon: mdi:access-point-network
              color_icon: true
            - entity: sensor.kantoor_power_switch_electric_consumption_w_2
              name: Office
              icon: mdi:office-building
              color:
                - 94
                - 48
                - 235
          solar:
            entity: sensor.inverter_total_power
            color_icon: true
        clickable_entities: true
        display_zero_lines:
          mode: show
          transparency: 50
          grey_color:
            - 189
            - 189
            - 189
        use_new_flow_rate_model: true
        w_decimals: 0
        kw_decimals: 1
        min_flow_rate: 0.75
        max_flow_rate: 6
        max_expected_power: 2000
        min_expected_power: 0.01
        watt_threshold: 1000
        transparency_zero_lines: 0
        dashboard_link: /energy
