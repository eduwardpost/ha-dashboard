                type: custom:button-card
                entity: this.entity_id
                icon: mdi:shield-alert
                show_name: true
                show_state: true
                tap_action:
                  action: more-info
                styles:
                  card:
                    - border-radius: 16px
                    - padding: 10px 12px
                    - height: 72px
                    - border-width: 1px
                    - border-style: solid
                    - border-color: rgba(220, 70, 70, 0.60)
                  name:
                    - font-size: 12px
                    - font-weight: 600
                  state:
                    - font-size: 10px
                    - opacity: 0.75
                  icon:
                    - color: rgb(220, 70, 70)
