  - title: Health
    path: health
    icon: mdi:heart-pulse
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(12, 1fr)
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
    cards:
      - type: markdown
        content: |
          # Health & personal metrics
          Steps, sleep, recovery and training readiness
        card_mod:
          style: |
            ha-card {
              background: rgba(var(--rgb-card-background-color), 0.72);
              border: 1px solid rgba(180, 190, 254, 0.18);
              border-radius: 22px;
              box-shadow: none;
              padding: 4px 10px 0 10px;
            }
