              {% set crit = states('sensor.wazuh_critical_24h')|int(0) %}
              {% set high = states('sensor.wazuh_high_24h')|int(0) %}
              {% set alarm = states('alarm_control_panel.alarm') %}
              {% set nas_warn = is_state('binary_sensor.synology_security_status', 'on') %}
              {% if crit > 0 or nas_warn %}
                Status: Kritiek
              {% elif high > 0 or alarm == 'disarmed' %}
                Status: Waarschuwing
              {% else %}
                Status: Goed
              {% endif %}
            icon_color: >
              {% set crit = states('sensor.wazuh_critical_24h')|int(0) %}
              {% set high = states('sensor.wazuh_high_24h')|int(0) %}
              {% set alarm = states('alarm_control_panel.alarm') %}
              {% set nas_warn = is_state('binary_sensor.synology_security_status', 'on') %}
              {% if crit > 0 or nas_warn %}
                red
              {% elif high > 0 or alarm == 'disarmed' %}
                amber
              {% else %}
                green
              {% endif %}
            tap_action:
              action: more-info
              entity: sensor.siem_security_score
          - type: template
            icon: mdi:shield-home
            content: Alarm {{ states('alarm_control_panel.alarm') }}
            icon_color: >
              {% if is_state('alarm_control_panel.alarm', 'disarmed') %}red{%
              else %}green{% endif %}
            tap_action:
              action: more-info
              entity: alarm_control_panel.alarm
          - type: template
            icon: mdi:shield-check
            content: SIEM {{ states('sensor.siem_security_score') }}
            icon_color: blue
            tap_action:
              action: more-info
              entity: sensor.siem_security_score
          - type: template
            icon: mdi:alert-octagon
            content: Kritiek {{ states('sensor.wazuh_critical_24h') }}
            icon_color: >
              {% if states('sensor.wazuh_critical_24h')|int(0) > 0 %}red{% else
              %}green{% endif %}
            tap_action:
              action: more-info
              entity: sensor.wazuh_critical_24h
          - type: template
            icon: mdi:alert
            content: Hoog {{ states('sensor.wazuh_high_24h') }}
            icon_color: >
              {% if states('sensor.wazuh_high_24h')|int(0) > 0 %}amber{% else
              %}green{% endif %}
            tap_action:
              action: more-info
              entity: sensor.wazuh_high_24h
          - type: template
            icon: mdi:nas
            content: >
              {% if is_state('binary_sensor.synology_security_status', 'on') %}
