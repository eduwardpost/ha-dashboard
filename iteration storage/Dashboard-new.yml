              {{ states('sensor.homelab_pods_count') }} pods •
              {{ states('sensor.homelab_nodes_count') }} nodes
            icon_color: >
              {% if is_state('binary_sensor.homelab_cluster_health', 'on') %}green{% else %}red{% endif %}
            tap_action:
              action: more-info
              entity: binary_sensor.homelab_cluster_health
          - type: template
            icon: mdi:backup-restore
            content: '{{ states(''sensor.backup_backup_manager_state'') }}'
            icon_color: >
              {% if states('sensor.backup_backup_manager_state') in ['idle',
              'ready', 'ok'] %}green{% else %}amber{% endif %}
            tap_action:
              action: more-info
              entity: sensor.backup_last_successful_automatic_backup
          - type: template
            icon: mdi:download-network
            content: >
              {{ states('sensor.speedtest_download')|round(0) }}↓ {{
              states('sensor.speedtest_upload')|round(0) }}↑
            icon_color: teal
            tap_action:
              action: more-info
              entity: sensor.speedtest_download
          - type: template
            icon: mdi:update
            content: |
              {% set updates = expand(states.update)
                | selectattr('state', 'eq', 'on') | list %}
              {{ updates | count }} openstaand
            icon_color: >
              {% set updates = expand(states.update)
                | selectattr('state', 'eq', 'on') | list %}
              {{ 'amber' if updates | count > 0 else 'green' }}
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/homelab
        card_mod:
          style: |
            ha-card {
              border-radius: 22px;
              border: 1px solid rgba(180, 190, 254, 0.18);
              box-shadow: none;
              padding: 10px;
              height: 100%;
