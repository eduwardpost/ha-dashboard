          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Node-status
                secondary: >
                  {% set bad = namespace(nodes=[]) %}
                  {% for n in [1,2,3,4,5] %}
                    {% set mem = 'binary_sensor.homelab_k8s_' ~ n ~ '_memory_pressure' %}
                    {% set dsk = 'binary_sensor.homelab_k8s_' ~ n ~ '_disk_pressure' %}
                    {% set pid = 'binary_sensor.homelab_k8s_' ~ n ~ '_pid_pressure' %}
                    {% set net = 'binary_sensor.homelab_k8s_' ~ n ~ '_network_unavailable' %}
                    {% if is_state(mem,'on') or is_state(dsk,'on') or is_state(pid,'on') or is_state(net,'on') %}
                      {% set bad.nodes = bad.nodes + ['k8s-' ~ n] %}
                    {% endif %}
                  {% endfor %}
                  {% if bad.nodes | length == 0 %}Alle 5 nodes gereed{% else %}Niet gereed: {{ bad.nodes | join(', ') }}{% endif %}
                icon: mdi:server-network
                icon_color: >
                  {% set bad = namespace(found=false) %}
                  {% for n in [1,2,3,4,5] %}
                    {% if is_state('binary_sensor.homelab_k8s_' ~ n ~ '_memory_pressure','on')
                      or is_state('binary_sensor.homelab_k8s_' ~ n ~ '_disk_pressure','on')
                      or is_state('binary_sensor.homelab_k8s_' ~ n ~ '_pid_pressure','on')
                      or is_state('binary_sensor.homelab_k8s_' ~ n ~ '_network_unavailable','on') %}
                      {% set bad.found = true %}
                    {% endif %}
                  {% endfor %}
                  {{ 'red' if bad.found else 'green' }}
