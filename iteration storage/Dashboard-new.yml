            title: SIEM / Wazuh overzicht
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: IT-beveiligingsstatus
                secondary: >
                  {% set score = states('sensor.siem_security_score')|int(0) %}
                  {% set crit = states('sensor.wazuh_critical_24h')|int(0) %}
                  {% set high = states('sensor.wazuh_high_24h')|int(0) %}
                  {% if crit > 0 %}
                    Kritieke druk
                  {% elif high > 0 %}
                    Verhoogde druk
                  {% elif score >= 80 %}
                    Gezond
                  {% else %}
                    Goed opletten
                  {% endif %}
                icon: mdi:shield-star
                icon_color: >
                  {% set crit = states('sensor.wazuh_critical_24h')|int(0) %}
                  {% set high = states('sensor.wazuh_high_24h')|int(0) %}
                  {% if crit > 0 %}
                    red
                  {% elif high > 0 %}
                    amber
                  {% else %}
                    green
                  {% endif %}
                tap_action:
                  action: more-info
                  entity: sensor.siem_security_score
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-template-card
                primary: Dreigingsdruk (24u)
                secondary: >
                  K {{ states('sensor.wazuh_critical_24h')|int(0) }} •
                  H {{ states('sensor.wazuh_high_24h')|int(0) }} •
                  M {{ states('sensor.wazuh_medium_24h')|int(0) }} •
                  L {{ states('sensor.wazuh_low_24h')|int(0) }}
                icon: mdi:alert-decagram
                icon_color: >
                  {% if states('sensor.wazuh_critical_24h')|int(0) > 0 %}
                    red
                  {% elif states('sensor.wazuh_high_24h')|int(0) > 0 %}
                    amber
                  {% else %}
                    green
                  {% endif %}
                tap_action:
                  action: more-info
                  entity: sensor.wazuh_critical_24h
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-template-card
