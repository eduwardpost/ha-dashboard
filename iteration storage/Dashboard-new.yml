# =====================================================================
#  Woning-dashboard — iteratie 2 (2026) — Nederlandstalig
#  Weergaven: Overzicht · Woning · Energie · Auto · Beveiliging · Homelab · Gezondheid
#  Stijl: Catppuccin-geïnspireerd, 22px radius, subtiele randen,
#  Mushroom + button-card + ApexCharts + power-flow-card-plus.
#  Nieuwe hardware: Peugeot 508 SW (PHEV) + Alfen laadpaal.
#  Best practices toegevoegd: modi/scènes-bediening, conditionele
#  kaarten (tonen alleen wanneer relevant), buiten-condities strip.
# =====================================================================
title: Woning
decluttering_templates:
  # Kleine vierkante actietegel (helpers, scènes, snelle drukknoppen)
  quick_button:
    card:
      type: custom:button-card
      entity: '[[entity]]'
      name: '[[name]]'
      icon: '[[icon]]'
      tap_action:
        action: '[[action]]'
      show_state: false
      styles:
        card:
          - border-radius: 16px
          - padding: 10px 12px
          - height: 64px
        icon:
          - width: 20px
        name:
          - font-size: 13px
          - font-weight: 600
  # Opdrachttegel die een service aanroept (bijv. button.press voor de auto)
  command_button:
    card:
      type: custom:button-card
      entity: '[[entity]]'
      name: '[[name]]'
      icon: '[[icon]]'
      tap_action:
        action: call-service
        service: '[[service]]'
        target:
          entity_id: '[[entity]]'
      show_state: false
      styles:
        card:
          - border-radius: 16px
          - padding: 10px 12px
          - height: 64px
        icon:
          - width: 20px
        name:
          - font-size: 12px
          - font-weight: 600

views:
  # ===================================================================
  #  OVERZICHT
  # ===================================================================
  - title: Overzicht
    path: overview
    icon: mdi:view-dashboard
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(12, 1fr)
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
    cards:
      # Statuschips — snel overzicht
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - icon: mdi:home-account
            type: template
            content: >
              {% if is_state('group.persons', 'home') %}Thuis{% else %}Weg{%
              endif %}
            icon_color: >
              {% if is_state('group.persons', 'home') %}green{% else %}amber{%
              endif %}
            tap_action:
              action: more-info
              entity: group.persons
          - icon: mdi:shield-home
            type: template
            tap_action:
              entity: alarm_control_panel.alarm
              action: more-info
            content: |
              {% if is_state('alarm_control_panel.alarm', 'armed_away')
                    or is_state('alarm_control_panel.alarm', 'armed_home')
                    or is_state('alarm_control_panel.alarm', 'armed_night') %}
                Ingeschakeld
              {% else %}
                Uitgeschakeld
              {% endif %}
            icon_color: |
              {% if is_state('alarm_control_panel.alarm', 'armed_away')
                    or is_state('alarm_control_panel.alarm', 'armed_home')
                    or is_state('alarm_control_panel.alarm', 'armed_night') %}
                green
              {% else %}
                red
              {% endif %}
          - icon: mdi:lock
            type: template
            tap_action:
              entity: lock.elite
              action: more-info
            content: >
              {% if is_state('lock.elite', 'locked') %}Vergrendeld{% else
              %}Ontgrendeld{% endif %}
            icon_color: >
              {% if is_state('lock.elite', 'locked') %}green{% else %}red{%
              endif %}
          - icon: mdi:solar-power
            type: template
            tap_action:
              entity: sensor.inverter_total_power
              action: more-info
            content: '{{ states(''sensor.inverter_total_power'') }} W'
            icon_color: yellow
          - icon: mdi:car-electric
            type: template
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/car
            content: >
              {{ states('sensor.oprit_508_sw_battery') }}% · {{
              states('sensor.oprit_508_sw_autonomy') }}
            icon_color: >
              {% if is_state('binary_sensor.oprit_508_sw_battery_charging',
              'on') %}blue{% elif
              states('sensor.oprit_508_sw_battery')|int(0) < 20 %}red{% else
              %}green{% endif %}
          - icon: mdi:download-network
            type: template
            content: >
              {{ states('sensor.speedtest_download')|round(0) }} / {{
              states('sensor.speedtest_upload')|round(0) }}
            icon_color: blue
          - icon: mdi:update
            type: template
            content: |
              {% set updates = expand(states.update)
                | selectattr('state', 'eq', 'on') | list %}
              {{ updates | count }} updates
            icon_color: >
              {% set updates = expand(states.update)
                | selectattr('state', 'eq', 'on') | list %}
              {{ 'amber' if updates | count > 0 else 'green' }}
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/homelab
        card_mod:
          style: |
            ha-card {
              border-radius: 22px;
              border: 1px solid rgba(180, 190, 254, 0.18);
              box-shadow: none;
              padding: 10px;
            }
            mushroom-template-chip, mushroom-entity-chip {
              margin: 2px !important;
            }
        view_layout:
          grid-column: 1 / 13

      # Categorienavigatie
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:button-card
            entity: alarm_control_panel.alarm
            name: Beveiliging
            icon: mdi:shield-home
            show_state: true
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/security
            styles:
              card:
                - border-radius: 22px
                - padding: 18px 12px
                - border: 1px solid rgba(180, 190, 254, 0.18)
              icon:
                - width: 34px
              name:
                - font-size: 17px
                - font-weight: 600
              state:
                - font-size: 14px
            state:
              - value: disarmed
                color: rgb(243, 139, 168)
              - value: armed_home
                color: rgb(166, 227, 161)
              - value: armed_away
                color: rgb(137, 180, 250)
              - value: armed_night
                color: rgb(203, 166, 247)
          - type: custom:button-card
            entity: input_boolean.current_light_state
            name: Woning
            icon: mdi:sofa
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/home
            styles:
              card:
                - border-radius: 22px
                - padding: 18px 12px
                - border: 1px solid rgba(180, 190, 254, 0.18)
              icon:
                - width: 34px
              name:
                - font-size: 17px
                - font-weight: 600
            color: rgb(203, 166, 247)
          - type: custom:button-card
            entity: sensor.inverter_total_power
            name: Energie
            icon: mdi:lightning-bolt
            show_state: true
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/energy
            styles:
              card:
                - border-radius: 22px
                - padding: 18px 12px
                - border: 1px solid rgba(180, 190, 254, 0.18)
              icon:
                - width: 34px
              name:
                - font-size: 17px
                - font-weight: 600
              state:
                - font-size: 14px
            color: rgb(245, 224, 94)
          - type: custom:button-card
            entity: sensor.oprit_508_sw_battery
            name: Auto
            icon: mdi:car-electric
            show_state: true
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/car
            state_display: >
              [[[ return `${states['sensor.oprit_508_sw_battery']?.state ??
              '-'}% · ${states['sensor.oprit_508_sw_autonomy']?.state ??
              '-'}`; ]]]
            styles:
              card:
                - border-radius: 22px
                - padding: 18px 12px
                - border: 1px solid rgba(180, 190, 254, 0.18)
              icon:
                - width: 34px
              name:
                - font-size: 17px
                - font-weight: 600
              state:
                - font-size: 13px
            color: rgb(137, 180, 250)
        view_layout:
          grid-column: 1 / 13

      # Lichtscène-keuze (rest van de modi wordt automatisch gezet)
      - type: custom:mushroom-select-card
        entity: input_select.light_scene
        name: Lichtscène
        icon: mdi:palette
        card_mod:
          style: |
            ha-card {
              border-radius: 22px;
              border: 1px solid rgba(180, 190, 254, 0.18);
              box-shadow: none;
            }
        view_layout:
          grid-column: 1 / 13

      # Conditioneel: verschijnt alleen wanneer de auto is aangesloten
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.oprit_508_sw_battery_plugged
            state: 'on'
        card:
          type: custom:mushroom-chips-card
          alignment: justify
          chips:
            - type: template
              icon: mdi:ev-station
              content: >
                Auto laadt · {{ states('sensor.alfen_jk_real_power_sum') }} W
              icon_color: blue
              tap_action:
                action: navigate
                navigation_path: /ha-dashboard/car
            - type: entity
              entity: sensor.oprit_508_sw_battery
              icon: mdi:battery-charging
            - type: entity
              entity: sensor.oprit_508_sw_battery_charging_end
              icon: mdi:clock-end
            - type: entity
              entity: sensor.alfen_jk_current_session_wh
              icon: mdi:counter
          card_mod:
            style: |
              ha-card {
                border-radius: 22px;
                border: 1px solid rgba(137, 180, 250, 0.45);
                box-shadow: none;
                padding: 10px;
              }
              mushroom-template-chip, mushroom-entity-chip {
                margin: 2px !important;
              }
        view_layout:
          grid-column: 1 / 13

      # Weer + kalender + afvalinzameling
      - type: grid
        columns: 3
        square: false
        cards:
          - show_current: true
            show_forecast: true
            type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
          - type: custom:calendar-card-pro
            entities:
              - calendar.afvalinfo_thuis_calendar
              - calendar.kyokushin_karate
              - calendar.persoonlijk
          - type: entities
            title: Afvalinzameling
            entities:
              - entity: sensor.afvalinfo_thuis_trash_type_today
                name: Vandaag
              - entity: sensor.afvalinfo_thuis_trash_type_tomorrow
                name: Morgen
              - entity: sensor.afvalinfo_thuis_restafval_2
                name: Restafval
              - entity: sensor.afvalinfo_thuis_papier_2
                name: Papier
              - entity: sensor.afvalinfo_thuis_gft
                name: GFT
        view_layout:
          grid-column: 1 / 13

      # Live vermogen + snelacties + vereist aandacht
      - type: grid
        columns: 3
        square: false
        cards:
          - type: grid
            title: Live vermogen
            columns: 1
            square: false
            cards:
              - type: custom:apexcharts-card
                header:
                  show: true
                  show_states: true
                  colorize_states: true
                graph_span: 12h
                now:
                  show: true
                series:
                  - entity: sensor.inverter_total_power
                    transform: 'return x / 1000;'
                    name: Zon
                    type: line
                    group_by:
                      func: avg
                      duration: 5min
                  - entity: sensor.electricity_meter_power_consumption
                    name: Import
                    type: line
                    group_by:
                      func: avg
                      duration: 5min
                  - entity: sensor.electricity_meter_power_production
                    name: Export
                    type: line
                    group_by:
                      func: avg
                      duration: 5min
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 22px;
                      border: 1px solid rgba(180, 190, 254, 0.18);
                      box-shadow: none;
                    }
          - type: grid
            title: Snelacties
            columns: 2
            square: false
            cards:
              - type: custom:decluttering-card
                template: quick_button
                variables:
                  - entity: input_boolean.start_ha_morning
                  - name: Ochtend
                  - icon: mdi:weather-sunset-up
                  - action: toggle
              - type: custom:decluttering-card
                template: quick_button
                variables:
                  - entity: input_boolean.start_ha_night_routine
                  - name: Nacht
                  - icon: mdi:weather-night
                  - action: toggle
              - type: custom:button-card
                entity: vacuum.roombot
                name: Stofzuiger starten
                icon: mdi:robot-vacuum
                tap_action:
                  action: call-service
                  service: vacuum.start
                  target:
                    entity_id: vacuum.roombot
                show_state: false
                styles:
                  card:
                    - border-radius: 16px
                    - padding: 10px 12px
                    - height: 64px
                  icon:
                    - width: 20px
                  name:
                    - font-size: 13px
                    - font-weight: 600
              - type: custom:button-card
                entity: input_button.run_speedtest
                name: Speedtest
                icon: mdi:speedometer
                tap_action:
                  action: call-service
                  service: input_button.press
                  target:
                    entity_id: input_button.run_speedtest
                show_state: false
                styles:
                  card:
                    - border-radius: 16px
                    - padding: 10px 12px
                    - height: 64px
                  icon:
                    - width: 20px
                  name:
                    - font-size: 13px
                    - font-weight: 600
          - type: custom:auto-entities
            card:
              type: grid
              title: Vereist aandacht
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - entity_id: binary_sensor.*low_battery*
                  state: 'on'
                  options:
                    type: custom:button-card
                    entity: this.entity_id
                    icon: mdi:battery-alert
                    show_name: true
                    show_state: true
                    tap_action:
                      action: more-info
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 10px 12px
                        - height: 70px
                        - border-width: 1px
                        - border-style: solid
                        - border-color: rgba(220, 70, 70, 0.60)
                      name:
                        - font-size: 12px
                        - font-weight: 600
                      state:
                        - font-size: 10px
                        - opacity: 0.75
                      icon:
                        - color: rgb(220, 70, 70)
                - entity_id: binary_sensor.*replace_battery*
                  state: 'on'
                  options:
                    type: custom:button-card
                    entity: this.entity_id
                    icon: mdi:battery-alert-variant-outline
                    show_name: true
                    show_state: true
                    tap_action:
                      action: more-info
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 10px 12px
                        - height: 70px
                        - border-width: 1px
                        - border-style: solid
                        - border-color: rgba(220, 70, 70, 0.60)
                      name:
                        - font-size: 12px
                        - font-weight: 600
                      state:
                        - font-size: 10px
                        - opacity: 0.75
                      icon:
                        - color: rgb(220, 70, 70)
                - entity_id: binary_sensor.*tamper*
                  state: 'on'
                  options:
                    type: custom:button-card
                    entity: this.entity_id
                    icon: mdi:shield-alert
                    show_name: true
                    show_state: true
                    tap_action:
                      action: more-info
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 10px 12px
                        - height: 70px
                        - border-width: 1px
                        - border-style: solid
                        - border-color: rgba(220, 70, 70, 0.60)
                      name:
                        - font-size: 12px
                        - font-weight: 600
                      state:
                        - font-size: 10px
                        - opacity: 0.75
                      icon:
                        - color: rgb(220, 70, 70)
                - entity_id: binary_sensor.*over_load*
                  state: 'on'
                  options:
                    type: custom:button-card
                    entity: this.entity_id
                    icon: mdi:flash-alert
                    show_name: true
                    show_state: true
                    tap_action:
                      action: more-info
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 10px 12px
                        - height: 70px
                        - border-width: 1px
                        - border-style: solid
                        - border-color: rgba(220, 70, 70, 0.60)
                      name:
                        - font-size: 12px
                        - font-weight: 600
                      state:
                        - font-size: 10px
                        - opacity: 0.75
                      icon:
                        - color: rgb(220, 70, 70)
                - entity_id: binary_sensor.*warnings
                  state: 'on'
                  options:
                    type: custom:button-card
                    entity: this.entity_id
                    icon: mdi:alert
                    show_name: true
                    show_state: true
                    tap_action:
                      action: more-info
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 10px 12px
                        - height: 70px
                        - border-width: 1px
                        - border-style: solid
                        - border-color: rgba(220, 70, 70, 0.60)
                      name:
                        - font-size: 12px
                        - font-weight: 600
                      state:
                        - font-size: 10px
                        - opacity: 0.75
                      icon:
                        - color: rgb(220, 70, 70)
                - domain: update
                  state: 'on'
                  options:
                    type: custom:button-card
                    entity: this.entity_id
                    icon: mdi:update
                    show_name: true
                    show_state: true
                    tap_action:
                      action: more-info
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 10px 12px
                        - height: 70px
                        - border-width: 1px
                        - border-style: solid
                        - border-color: rgba(220, 160, 60, 0.55)
                      name:
                        - font-size: 12px
                        - font-weight: 600
                      state:
                        - font-size: 10px
                        - opacity: 0.75
                      icon:
                        - color: rgb(220, 160, 60)
              exclude: []
            sort:
              method: friendly_name
            show_empty: false
        view_layout:
          grid-column: 1 / 13

  # ===================================================================
  #  WONING
  # ===================================================================
  - title: Woning
    path: home
    icon: mdi:sofa
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(12, 1fr)
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
    cards:
      # Statuschips woning
      - type: custom:mushroom-chips-card
        alignment: justify
        chips:
          - type: template
            icon: mdi:lightbulb-group
            content: >
              {{ states.light | selectattr('state','eq','on') | list | count }} lampen aan
            icon_color: >
              {{ 'amber' if (states.light | selectattr('state','eq','on') | list | count) > 0 else 'grey' }}
          - type: entity
            entity: sensor.tempature_sensor_temperature
            icon: mdi:thermometer
          - type: entity
            entity: sensor.tempature_sensor_humidity
            icon: mdi:water-percent
          - type: entity
            entity: sensor.multisensor_6_carbon_dioxide_co2_level
            icon: mdi:molecule-co2
          - type: template
            icon: mdi:television
            content: >
              {{ states.media_player | selectattr('state','eq','playing') | list | count }} spelen
            icon_color: >
              {{ 'blue' if (states.media_player | selectattr('state','eq','playing') | list | count) > 0 else 'grey' }}
          - type: template
            icon: mdi:robot-vacuum
            content: '{{ states(''vacuum.roombot'') }}'
            icon_color: >
              {% if is_state('vacuum.roombot','cleaning') %}blue{% elif is_state('vacuum.roombot','error') %}red{% else %}grey{% endif %}
            tap_action:
              action: more-info
              entity: vacuum.roombot
        card_mod:
          style: |
            ha-card {
              border-radius: 22px;
              border: 1px solid rgba(180, 190, 254, 0.18);
              box-shadow: none;
              padding: 10px;
            }
            mushroom-template-chip, mushroom-entity-chip {
              margin: 2px !important;
            }
        view_layout:
          grid-column: 1 / 13

      # Verlichting
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-title-card
            title: Verlichting
            subtitle: Tik om te schakelen, houd vast voor bediening
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-light-card
                entity: light.downstairs
                name: Beneden
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.living_room_lights
                name: Woonkamer
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.kitchen_lights
                name: Keuken
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.eetkamer
                name: Eetkamer
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.schilderij
                name: Schilderij
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.hal
                name: Hal
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.kantoor
                name: Kantoor
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.keuken_boven
                name: Keuken boven
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.slaapkamer_plafond
                name: Slaapkamer
                show_brightness_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.buiten_lampen_oprit
                name: Oprit
                show_brightness_control: false
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.buiten_lampen_garage
                name: Garage buiten
                show_brightness_control: false
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
              - type: custom:mushroom-light-card
                entity: light.buiten_stekker
                name: Buitenstekker
                show_brightness_control: false
                card_mod:
                  style: |
                    ha-card { border-radius: 22px; border: 0px; box-shadow: none; }
        card_mod:
          style: |
            ha-card {
              border-radius: 22px;
              border: 1px solid rgba(180, 190, 254, 0.18);
              box-shadow: none;
            }
        view_layout:
          grid-column: 1 / 7

      # Klimaat / binnencondities
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-title-card
            title: Klimaat
            subtitle: Binnencondities
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.tempature_sensor_temperature
                name: Woonkamer temp
                icon: mdi:thermometer
