          show_states: true
          colorize_states: true
        graph_span: 7d
        span:
          end: day
        series:
          - entity: sensor.wazuh_critical_24h
            name: Kritiek
            type: column
            group_by:
              func: max
              duration: 1d
          - entity: sensor.wazuh_high_24h
            name: Hoog
            type: column
            group_by:
              func: max
              duration: 1d
          - entity: sensor.wazuh_medium_24h
            name: Middel
            type: column
            group_by:
              func: max
              duration: 1d
          - entity: sensor.wazuh_low_24h
            name: Laag
            type: column
            group_by:
              func: max
              duration: 1d

      # ---- Logboek -------------------------------------------------------
      - type: logbook
        title: Recente gebeurtenissen (24u)
        card_mod: *cm
        view_layout:
          grid-column: 1 / -1
        hours_to_show: 24
        entities:
          - alarm_control_panel.alarm
          - lock.elite
          - binary_sensor.frontdoor_open
          - binary_sensor.front_door_motion
          - binary_sensor.back_yard_motion_sensor_motion_detection

