        card_mod: *cm
        view_layout:
          grid-column: 1 / -1
        default_zoom: 12
        entities:
          - device_tracker.oprit_508_sw_vehicle
          - person.eduward_post

      # ---- Live laden (conditioneel) -------------------------------------
