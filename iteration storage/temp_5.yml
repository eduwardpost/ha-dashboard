          - entity: sensor.oprit_508_sw_speed
            name: Snelheid
          - entity: sensor.oprit_508_sw_fuel_consumption_instant
            name: Verbruik nu
          - entity: sensor.oprit_508_sw_fuel_consumption_total
            name: Verbruik totaal
          - entity: sensor.oprit_508_sw_coolant_temperature
            name: Koelvloeistof
          - entity: sensor.oprit_508_sw_oil_temperature
            name: Olie
          - entity: sensor.oprit_508_sw_air_temperature
            name: Buitentemp.
          - entity: sensor.oprit_508_sw_service_battery
            name: Startaccu

      # ---- Accugezondheid & laden ----------------------------------------
      - type: entities
        title: Accu & laden
        card_mod: *cm
        entities:
          - entity: sensor.oprit_508_sw_battery_soh_capacity
            name: SoH capaciteit
          - entity: sensor.oprit_508_sw_battery_soh_resistance
            name: SoH weerstand
          - entity: sensor.oprit_508_sw_battery_charging_rate
            name: Laadsnelheid
          - entity: sensor.oprit_508_sw_battery_charging_type
            name: Laadtype
          - entity: sensor.oprit_508_sw_battery_charging_end
            name: Klaar om
          - entity: sensor.oprit_508_sw_last_charge
            name: Laatste laadbeurt
          - entity: number.oprit_508_sw_battery_charging_limit
            name: Laadlimiet
          - entity: switch.oprit_508_sw_battery_charging_limit
            name: Laadlimiet actief
