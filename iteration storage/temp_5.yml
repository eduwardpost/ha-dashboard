                entity: binary_sensor.multisensor_6_motion_detection
                icon: mdi:motion-sensor
              - type: entity
                entity: binary_sensor.slaapkamer_beweging_occupancy
                icon: mdi:motion-sensor

      # ---- Deurbel (Ring) ------------------------------------------------
      - type: entities
        title: Deurbel
        card_mod: *cm
        entities:
          - entity: sensor.front_door_battery
            name: Batterij
          - entity: sensor.front_door_last_motion
            name: Laatste beweging
          - entity: sensor.front_door_last_ding
            name: Laatste bel
          - entity: switch.front_door_motion_detection
            name: Bewegingsdetectie
          - entity: switch.front_door_in_home_chime
            name: Binnengong

      # ---- SIEM / Wazuh --------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Beveiligingsmonitoring
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:shield-check
                content: '{{ states("sensor.siem_security_score") }}'
                icon_color: >
                  {% if states('sensor.siem_security_score')|int(0) > 80 %}green
                  {% elif states('sensor.siem_security_score')|int(0) > 50 %}amber
                  {% else %}red{% endif %}
                tap_action:
                  action: more-info
                  entity: sensor.siem_security_score
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:alert-octagon
                content: 'Kritiek {{ states("sensor.wazuh_critical_24h") }}'
                icon_color: red
              - type: template
                icon: mdi:alert
                content: 'Hoog {{ states("sensor.wazuh_high_24h") }}'
