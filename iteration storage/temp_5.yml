            name: Max. hartslag

      # ---- Body Battery & stress -----------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Body Battery & stress
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:battery-heart-variant
                content: '{{ states("sensor.body_battery_most_recent") }}'
                icon_color: >
                  {% if states('sensor.body_battery_most_recent')|int(0) > 50 %}green{% else %}amber{% endif %}
                tap_action:
                  action: more-info
                  entity: sensor.body_battery_most_recent
              - type: entity
                entity: sensor.body_battery_highest
                icon: mdi:arrow-up-bold
              - type: entity
                entity: sensor.body_battery_lowest
                icon: mdi:arrow-down-bold
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.avg_stress_level
                icon: mdi:emoticon-neutral
              - type: entity
                entity: sensor.average_spo2
                icon: mdi:lungs

      # ---- Slaap vannacht ------------------------------------------------
      - type: entities
        title: Slaap vannacht
        card_mod: *cm
        entities:
          - entity: sensor.sleep_score
            name: Slaapscore
          - entity: sensor.total_sleep_duration
            name: Totale slaap
          - entity: sensor.garmin_connect_deep_sleep
            name: Diepe slaap
          - entity: sensor.garmin_connect_light_sleep
            name: Lichte slaap
          - entity: sensor.garmin_connect_rem_sleep
            name: REM-slaap
          - entity: sensor.garmin_connect_awake_time
            name: Wakker
          - entity: sensor.garmin_connect_bedtime
            name: Bedtijd
          - entity: sensor.garmin_connect_wake_time
            name: Wektijd

      # ---- Lichaamssamenstelling -----------------------------------------
      - type: entities
        title: Lichaamssamenstelling
        card_mod: *cm
        entities:
          - entity: sensor.garmin_connect_weight
            name: Gewicht
          - entity: sensor.bmi
            name: BMI
          - entity: sensor.body_fat
            name: Vetpercentage
          - entity: sensor.muscle_mass
            name: Spiermassa
          - entity: sensor.body_water
            name: Lichaamswater
          - entity: sensor.bone_mass
            name: Botmassa
          - entity: sensor.visceral_fat
            name: Visceraal vet
          - entity: sensor.metabolic_age
            name: Metabole leeftijd
          - entity: sensor.physique_rating
            name: Lichaamsbouw

      # ---- Grafiek: stappen (7d) -----------------------------------------
      - type: custom:apexcharts-card
        view_layout:
          grid-column: 1 / -1
        card_mod: *cm
        header:
          show: true
          title: Stappen (7d)
          show_states: true
          colorize_states: true
        graph_span: 7d
        span:
          end: day
        series:
          - entity: sensor.total_steps
            name: Stappen
            type: column
            group_by:
              func: max
              duration: 1d

      # ---- Grafiek: gewicht (30d) ----------------------------------------
      - type: custom:apexcharts-card
        view_layout:
          grid-column: 1 / -1
        card_mod: *cm
        header:
          show: true
          title: Gewicht (30d)
          show_states: true
          colorize_states: true
        graph_span: 30d
        series:
          - entity: sensor.garmin_connect_weight
            name: Gewicht
            group_by:
              func: avg
              duration: 1d
