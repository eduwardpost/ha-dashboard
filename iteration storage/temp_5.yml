              - type: custom:decluttering-card
                template: command_button
                variables:
                  - name: Laden stop
                  - icon: mdi:stop
                  - color: red
                  - entity: button.oprit_508_sw_charge_stop
              - type: custom:decluttering-card
                template: command_button
                variables:
                  - name: Voorklim.
