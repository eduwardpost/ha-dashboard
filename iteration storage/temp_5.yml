# =====================================================================
#  Woning-dashboard — FROM SCRATCH build (2026)
#  Uitsluitend gebouwd op basis van entities.jsonc (geen verzonnen entiteiten).
#  Stijl: Catppuccin-geïnspireerd — Mushroom + button-card + ApexCharts +
#         power-flow-card-plus + auto-entities + stack-in-card + card-mod.
#  Layout: layout-card (responsive auto-fit grid).
#  Weergaven: Overzicht · Woning · Energie · Auto · Beveiliging · Homelab · Gezondheid
#  Padnamen blijven Engels zodat interne navigatie werkt; titels zijn Nederlands.
# =====================================================================
title: Woning

decluttering_templates:
  # Opdrachttegel die een button.press aanroept (auto-commando's e.d.)
  command_button:
    card:
      type: custom:mushroom-template-card
      primary: '[[name]]'
      icon: '[[icon]]'
      icon_color: '[[color]]'
      layout: vertical
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: '[[entity]]'

views:
  # ===================================================================
  #  1 · OVERZICHT
  # ===================================================================
  - title: Overzicht
    path: overview
    icon: mdi:view-dashboard
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr))
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
    cards:
      # ---- Statuschips (volledige breedte) ------------------------------
      - type: custom:mushroom-chips-card
        alignment: center
        view_layout:
          grid-column: 1 / -1
        chips:
          - type: template
            icon: mdi:home-account
            content: >
              {% if is_state('group.persons','home') %}Thuis{% else %}Weg{% endif %}
            icon_color: >
              {% if is_state('group.persons','home') %}green{% else %}amber{% endif %}
            tap_action:
              action: more-info
              entity: group.persons
          - type: template
            icon: mdi:shield-home
            entity: alarm_control_panel.alarm
            content: >
              {% if states('alarm_control_panel.alarm').startswith('armed') %}Aan{% else %}Uit{% endif %}
            icon_color: >
              {% if states('alarm_control_panel.alarm').startswith('armed') %}green{% else %}red{% endif %}
            tap_action:
              action: more-info
              entity: alarm_control_panel.alarm
          - type: template
            icon: mdi:lock
            entity: lock.elite
            content: >
              {% if is_state('lock.elite','locked') %}Vergrendeld{% else %}Open{% endif %}
            icon_color: >
              {% if is_state('lock.elite','locked') %}green{% else %}red{% endif %}
            tap_action:
              action: more-info
              entity: lock.elite
          - type: template
            icon: mdi:solar-power-variant
            content: >
              {{ (states('sensor.inverter_total_power')|float(0)/1000)|round(2) }} kW
            icon_color: amber
            tap_action:
              action: more-info
              entity: sensor.inverter_total_power
          - type: template
            icon: mdi:transmission-tower
            entity: sensor.electricity_meter_power_consumption
            content: >
              {{ states('sensor.electricity_meter_power_consumption') }} kW
            icon_color: blue
            tap_action:
              action: more-info
              entity: sensor.electricity_meter_power_consumption
          - type: template
            icon: mdi:car-electric
            entity: sensor.oprit_508_sw_battery
            content: '{{ states("sensor.oprit_508_sw_battery") }}%'
            icon_color: >
              {% if states('sensor.oprit_508_sw_battery')|int(0) > 50 %}green{% else %}amber{% endif %}
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/car
          - type: template
            icon: mdi:robot-vacuum
            entity: vacuum.roombot
            content: '{{ states("vacuum.roombot") }}'
            icon_color: >
              {% if is_state('vacuum.roombot','cleaning') %}blue{% else %}grey{% endif %}
            tap_action:
              action: more-info
              entity: vacuum.roombot
          - type: template
            icon: mdi:speedometer
            content: '{{ states("sensor.speedtest_download")|round(0) }}↓ Mbps'
            icon_color: teal
            tap_action:
              action: more-info
              entity: sensor.speedtest_download

      # ---- Weer -----------------------------------------------------------
      - type: weather-forecast
        entity: weather.forecast_home
        show_current: true
        show_forecast: true
        forecast_type: daily

      # ---- Scène-keuze ----------------------------------------------------
      - type: custom:stack-in-card
        card_mod: &cm
          style: |
            ha-card {
              border-radius: 22px;
              border: 1px solid rgba(180, 190, 254, 0.18);
              box-shadow: none;
            }
        cards:
          - type: custom:mushroom-title-card
            title: Scène & modi
            subtitle: Kies een lichtscène
          - type: custom:mushroom-select-card
            entity: input_select.light_scene
            icon: mdi:palette
            name: Lichtscène
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: input_select.mode
                icon: mdi:tune-variant
              - type: entity
                entity: input_boolean.guest_mode
                icon: mdi:account-supervisor
              - type: entity
                entity: input_boolean.vacation_mode
                icon: mdi:bag-suitcase
              - type: entity
                entity: input_boolean.slaap_modus
                icon: mdi:sleep

      # ---- Snelle verlichting --------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Snelle verlichting
          - type: custom:mushroom-light-card
            entity: light.living_room_lights
            name: Woonkamer
            use_light_color: true
            show_brightness_control: true
            icon: mdi:sofa
          - type: custom:mushroom-light-card
            entity: light.kitchen_lights
            name: Keuken
            use_light_color: true
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.eetkamer
            name: Eetkamer
            use_light_color: true
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.hal
            name: Hal
            use_light_color: true
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.kantoor
            name: Kantoor
            use_light_color: true
            show_brightness_control: true

      # ---- Afval & buitencondities ---------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Vandaag
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.afvalinfo_thuis_trash_type_today
                icon: mdi:trash-can
              - type: entity
                entity: sensor.afvalinfo_thuis_trash_type_tomorrow
                icon: mdi:trash-can-outline
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.sun_next_rising
                icon: mdi:weather-sunset-up
              - type: entity
                entity: sensor.sun_next_setting
                icon: mdi:weather-sunset-down
              - type: entity
                entity: sensor.moon_phase
                icon: mdi:moon-waning-crescent
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.kleenex_pollen_radar_home_trees_level
                icon: mdi:tree
              - type: entity
                entity: sensor.kleenex_pollen_radar_home_grass_level
                icon: mdi:grass
              - type: entity
                entity: sensor.kleenex_pollen_radar_home_weeds_level
                icon: mdi:flower-pollen

      # ---- Actieve media --------------------------------------------------
      - type: custom:auto-entities
        card:
          type: custom:stack-in-card
          card_mod: *cm
        card_param: cards
        filter:
          include:
            - domain: media_player
              state: playing
              options:
                type: custom:mushroom-media-player-card
                use_media_info: true
                media_controls:
                  - play_pause_stop
                  - next
                volume_controls:
                  - volume_buttons
          exclude: []
        sort:
          method: friendly_name
        show_empty: false

      # ---- Agenda ---------------------------------------------------------
      - type: calendar
        title: Agenda
        initial_view: listWeek
        entities:
          - calendar.persoonlijk
          - calendar.kyokushin_karate
          - calendar.afvalinfo_thuis_calendar
          - calendar.radarr

      # ---- Energie vandaag (grafiek, volle breedte) ----------------------
      - type: custom:apexcharts-card
        view_layout:
          grid-column: 1 / -1
        card_mod: *cm
        header:
          show: true
          title: Energie vandaag
          show_states: true
          colorize_states: true
        graph_span: 24h
        series:
          - entity: sensor.inverter_total_power
            transform: 'return x / 1000;'
            name: Zon
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.electricity_meter_power_consumption
            name: Import
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.electricity_meter_power_production
            name: Export
            group_by:
              func: avg
              duration: 10min

  # ===================================================================
  #  2 · WONING
  # ===================================================================
  - title: Woning
    path: home
    icon: mdi:home-variant
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr))
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
    cards:
      # ---- Verlichting per ruimte ----------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Beneden
          - type: custom:mushroom-light-card
            entity: light.living_room_lights
            name: Woonkamer
            use_light_color: true
            show_brightness_control: true
            show_color_temp_control: true
          - type: custom:mushroom-light-card
            entity: light.kitchen_lights
            name: Keuken
            use_light_color: true
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.keuken_boven
            name: Keuken boven
            use_light_color: true
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.eetkamer
            name: Eetkamer
            use_light_color: true
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.schilderij
            name: Schilderij
            use_light_color: true
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.hal
            name: Hal
            use_light_color: true
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.downstairs
            name: Beneden (groep)
            use_light_color: true
            show_brightness_control: true

      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Boven & kantoor
          - type: custom:mushroom-light-card
            entity: light.kantoor
            name: Kantoor
            use_light_color: true
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.slaapkamer_plafond
            name: Slaapkamer plafond
            use_light_color: true
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.slaapkamer_hoek
            name: Slaapkamer hoek
            use_light_color: true
            show_brightness_control: true

      # ---- Buitenverlichting & stekkers ----------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Buiten
          - type: custom:mushroom-light-card
            entity: light.buiten_lampen_oprit
            name: Oprit
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.buiten_lampen_garage
            name: Garage
            show_brightness_control: true
          - type: custom:mushroom-entity-card
            entity: switch.buiten_stekker
            name: Buitenstekker
            icon: mdi:power-socket-eu
          - type: custom:mushroom-entity-card
            entity: switch.kerst_stekker_4
            name: Kerststekker
            icon: mdi:string-lights

      # ---- Klimaat & luchtkwaliteit --------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Klimaat & lucht
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.multisensor_6_air_temperature
                icon: mdi:thermometer
              - type: entity
                entity: sensor.multisensor_6_humidity
                icon: mdi:water-percent
              - type: entity
                entity: sensor.multisensor_6_illuminance
                icon: mdi:brightness-5
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_temperature
                icon: mdi:thermometer
              - type: entity
                entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_humidity
                icon: mdi:water-percent
              - type: entity
                entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_carbon_dioxide
                icon: mdi:molecule-co2
              - type: entity
                entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_pm2_5
                icon: mdi:blur
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.tempature_sensor_temperature
                icon: mdi:thermometer
              - type: entity
                entity: sensor.tempature_sensor_humidity
                icon: mdi:water-percent
              - type: entity
                entity: sensor.multisensor_6_carbon_dioxide_co2_level
                icon: mdi:molecule-co2

      # ---- Klimaattrend (grafiek) ----------------------------------------
      - type: custom:apexcharts-card
        view_layout:
          grid-column: 1 / -1
        card_mod: *cm
        header:
          show: true
          title: Klimaattrend (24u)
          show_states: true
          colorize_states: true
        graph_span: 24h
        yaxis:
          - id: temp
            decimals: 1
            apex_config:
              title:
                text: °C
          - id: co2
            opposite: true
            apex_config:
              title:
                text: ppm
        series:
          - entity: sensor.multisensor_6_air_temperature
            name: Woonkamer
            yaxis_id: temp
            group_by:
              func: avg
              duration: 15min
          - entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_temperature
            name: Slaapkamer
            yaxis_id: temp
            group_by:
              func: avg
              duration: 15min
          - entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_carbon_dioxide
            name: CO₂
            yaxis_id: co2
            group_by:
              func: avg
              duration: 15min

      # ---- Stofzuiger ----------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Roombot
          - type: custom:mushroom-vacuum-card
            entity: vacuum.roombot
            icon: mdi:robot-vacuum
            commands:
              - start
              - pause
              - stop
              - return_home
              - locate
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.roombot_battery_level
                icon: mdi:battery
              - type: entity
                entity: binary_sensor.roombot_bin_full
                icon: mdi:delete-alert
              - type: entity
                entity: sensor.roombot_total_missions
                icon: mdi:counter

      # ---- Media ---------------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Media
          - type: custom:mushroom-media-player-card
            entity: media_player.tv_samsung_7_series_55
            name: TV woonkamer
            use_media_info: true
          - type: custom:mushroom-media-player-card
            entity: media_player.keuken_speaker
            name: Keuken speaker
            use_media_info: true
          - type: custom:mushroom-media-player-card
            entity: media_player.office_speaker
            name: Kantoor speaker
            use_media_info: true
          - type: custom:mushroom-media-player-card
            entity: media_player.bedroom
            name: Slaapkamer
            use_media_info: true

  # ===================================================================
  #  3 · ENERGIE
  # ===================================================================
  - title: Energie
    path: energy
    icon: mdi:lightning-bolt
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr))
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
    cards:
      # ---- Energiestroom -------------------------------------------------
      - type: custom:power-flow-card-plus
        card_mod: *cm
        entities:
          grid:
            entity:
              consumption: sensor.electricity_meter_power_consumption
              production: sensor.electricity_meter_power_production
            color_circle: true
            display_state: two_way
            color_value: true
            color_icon: true
          solar:
            entity: sensor.inverter_total_power
            color_icon: true
          home:
            color_icon: true
          fossil_fuel_percentage:
            entity: sensor.co2_signal_grid_fossil_fuel_percentage
            color_value: false
            color_icon: true
            state_type: percentage
          individual:
            - entity: sensor.alfen_jk_real_power_sum
              name: Laadpaal
              icon: mdi:ev-station
              color_icon: true
              calculate_flow_rate: true
            - entity: sensor.zolder_power_switch_power_2
              name: Servers
              icon: mdi:server
              color_icon: true
              calculate_flow_rate: true
            - entity: sensor.meterkast_power_switch_electric_consumption_w
              name: Netwerk
              icon: mdi:access-point-network
              color_icon: true
            - entity: sensor.kantoor_power_switch_electric_consumption_w_2
              name: Kantoor
              icon: mdi:office-building
              color_icon: true

      # ---- Zon & opbrengst -----------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Zon & opbrengst
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:solar-power
                content: >
                  {{ (states('sensor.inverter_voor_energy_today')|float(0) +
                      states('sensor.inverter_achter_energy_today')|float(0))|round(1) }} kWh
                icon_color: amber
              - type: template
                icon: mdi:calendar-month
                content: >
                  {{ (states('sensor.inverter_voor_energy_this_month')|float(0) +
                      states('sensor.inverter_achter_energy_this_month')|float(0))|round(0) }} kWh
                icon_color: orange
              - type: template
                icon: mdi:cash
                content: >
                  €{{ (states('sensor.inverter_voor_income_today')|float(0) +
                      states('sensor.inverter_achter_income_today')|float(0))|round(2) }}
                icon_color: green
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.inverter_voor
                icon: mdi:solar-panel
              - type: entity
                entity: sensor.inverter_achter
                icon: mdi:solar-panel-large
              - type: entity
                entity: sensor.electricity_meter_active_tariff
                icon: mdi:transmission-tower

      # ---- Meterstanden --------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Meterstanden
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.electricity_meter_energy_consumption_tarif_1
                icon: mdi:weather-night
              - type: entity
                entity: sensor.electricity_meter_energy_consumption_tarif_2
                icon: mdi:weather-sunny
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.electricity_meter_energy_production_tarif_1
                icon: mdi:transmission-tower-export
              - type: entity
                entity: sensor.electricity_meter_energy_production_tarif_2
                icon: mdi:transmission-tower-export
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.gas_meter_gas_consumption
                icon: mdi:fire
              - type: entity
                entity: sensor.dsmr_gas_used
                icon: mdi:meter-gas

      # ---- Thuisbatterij -------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Thuisbatterij
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:battery-charging
                content: >
                  {{ (states('sensor.zolder_inverter_voor_battery_charge_today')|float(0) +
                      states('sensor.zolder_inverter_achter_battery_charge_today')|float(0))|round(1) }} kWh in
                icon_color: green
              - type: template
                icon: mdi:battery-arrow-down
                content: >
                  {{ (states('sensor.zolder_inverter_voor_battery_discharge_today')|float(0) +
                      states('sensor.zolder_inverter_achter_battery_discharge_today')|float(0))|round(1) }} kWh uit
                icon_color: orange
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.inverter_voor_battery_voltage
                icon: mdi:flash
              - type: entity
                entity: sensor.inverter_achter_battery_voltage
                icon: mdi:flash

      # ---- Netkwaliteit --------------------------------------------------
      - type: entities
        title: Netkwaliteit
        card_mod: *cm
        view_layout:
          grid-column: 1 / -1
        columns: 3
        entities:
          - entity: sensor.electricity_meter_voltage_phase_l1
            name: Spanning L1
          - entity: sensor.electricity_meter_voltage_phase_l2
            name: Spanning L2
          - entity: sensor.electricity_meter_voltage_phase_l3
            name: Spanning L3
          - entity: sensor.electricity_meter_current_phase_l1
            name: Stroom L1
          - entity: sensor.electricity_meter_current_phase_l2
            name: Stroom L2
          - entity: sensor.electricity_meter_current_phase_l3
            name: Stroom L3
          - entity: sensor.electricity_meter_short_power_failure_count
            name: Korte storingen
          - entity: sensor.electricity_meter_long_power_failure_count
            name: Lange storingen
          - entity: sensor.co2_signal_co2_intensity
            name: CO₂-intensiteit net

      # ---- Laadpaal (Alfen) ----------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Laadpaal
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.alfen_jk_car_connected
                icon: mdi:ev-plug-type2
              - type: entity
                entity: sensor.alfen_jk_car_charging
                icon: mdi:battery-charging
              - type: entity
                entity: sensor.alfen_jk_real_power_sum
                icon: mdi:flash
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.alfen_jk_current_session_wh
                icon: mdi:counter
              - type: entity
                entity: sensor.alfen_jk_current_session_duration
                icon: mdi:timer
              - type: entity
                entity: sensor.alfen_jk_board_temperature
                icon: mdi:thermometer
          - type: custom:mushroom-number-card
            entity: number.alfen_jk_max_current_limit_s1
            name: Max. laadstroom
            icon: mdi:current-ac
          - type: custom:mushroom-select-card
            entity: select.alfen_jk_usable_phases1
            name: Fasegebruik
            icon: mdi:sine-wave

      # ---- Grafiek: energie 24u ------------------------------------------
      - type: custom:apexcharts-card
        view_layout:
          grid-column: 1 / -1
        card_mod: *cm
        header:
          show: true
