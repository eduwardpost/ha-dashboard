            name: Visceraal vet
          - entity: sensor.metabolic_age
            name: Metabole leeftijd

      # ---- Gewicht & samenstelling (30d) — kg + water% dubbele as --------
      - type: custom:apexcharts-card
        view_layout:
          grid-column: 1 / -1
        card_mod: *cm
        header:
          show: true
          title: Gewicht & samenstelling (30d)
          show_states: true
          colorize_states: true
        graph_span: 30d
        yaxis:
          - id: kg
            decimals: 1
            apex_config:
              title:
                text: kg
          - id: pct
            opposite: true
            decimals: 0
            apex_config:
              title:
                text: '%'
        series:
          - entity: sensor.garmin_connect_weight
            name: Gewicht
            yaxis_id: kg
            group_by:
              func: avg
              duration: 1d
          - entity: sensor.muscle_mass
            name: Spiermassa
            yaxis_id: kg
            group_by:
              func: avg
              duration: 1d
          - entity: sensor.bone_mass
            name: Botmassa
            yaxis_id: kg
            group_by:
              func: avg
              duration: 1d
          - entity: sensor.body_water
            name: Water
            yaxis_id: pct
            group_by:
              func: avg
              duration: 1d

      # ---- Stappen (7d) — onderaan ---------------
      - type: custom:apexcharts-card
        card_mod: *cm
        view_layout:
          grid-column: 1 / -1
        header:
          show: true
          title: Stappen (7d)
          show_states: false
        graph_span: 7d
        span:
          end: day
        series:
          - entity: sensor.total_steps
            name: Stappen
            type: column
            group_by:
              func: max
              duration: 1d
