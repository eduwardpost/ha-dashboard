            name: Laadpaal
            group_by:
              func: avg
              duration: 10min

  # ===================================================================
  #  4 · AUTO — Peugeot 508 SW (PHEV)
  # ===================================================================
  - title: Auto
    path: car
    icon: mdi:car-sports
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr))
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      align-items: stretch
    cards:
      # ---- Accu & brandstof — snelle balken (%, met actieradius km) ------
      - type: custom:stack-in-card
        view_layout:
          grid-column: 1 / -1
        card_mod: *cm
        cards:
          - type: custom:mushroom-template-card
            primary: Accu
            secondary: >
              {{ states('sensor.oprit_508_sw_battery') }}% ·
              {{ states('sensor.oprit_508_sw_autonomy') }} km actieradius
            icon: mdi:battery-high
            icon_color: >
              {% if states('sensor.oprit_508_sw_battery')|int(0) > 50 %}green
              {% elif states('sensor.oprit_508_sw_battery')|int(0) > 20 %}amber
              {% else %}red{% endif %}
            multiline_secondary: true
            card_mod:
              style: |
                ha-card {
                  border: none;
                  background: linear-gradient(to right,
                    rgba(var(--rgb-green), 0.22) {{ states('sensor.oprit_508_sw_battery')|int(0) }}%,
                    rgba(var(--rgb-green), 0.0) {{ states('sensor.oprit_508_sw_battery')|int(0) }}%);
                }
          - type: custom:mushroom-template-card
            primary: Brandstof
            secondary: >
              {{ states('sensor.oprit_508_sw_fuel') }}% ·
              {{ states('sensor.oprit_508_sw_fuel_autonomy') }} km actieradius
            icon: mdi:gas-station
            icon_color: >
              {% if states('sensor.oprit_508_sw_fuel')|int(0) > 50 %}green
              {% elif states('sensor.oprit_508_sw_fuel')|int(0) > 20 %}amber
              {% else %}red{% endif %}
            multiline_secondary: true
            card_mod:
              style: |
                ha-card {
                  border: none;
                  background: linear-gradient(to right,
                    rgba(var(--rgb-amber), 0.22) {{ states('sensor.oprit_508_sw_fuel')|int(0) }}%,
                    rgba(var(--rgb-amber), 0.0) {{ states('sensor.oprit_508_sw_fuel')|int(0) }}%);
                }

      # ---- Status (tegels) -----------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Status
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
                entity: binary_sensor.oprit_508_sw_doors
                name: Deuren
                icon: mdi:car-door
                color: blue
              - type: tile
                card_mod: *tile
                entity: binary_sensor.oprit_508_sw_battery_plugged
                name: Stekker
                icon: mdi:ev-plug-type2
                color: teal
              - type: tile
                card_mod: *tile
                entity: binary_sensor.oprit_508_sw_battery_charging
                name: Laden
                icon: mdi:battery-charging
                color: green
              - type: tile
                card_mod: *tile
                entity: binary_sensor.oprit_508_sw_preconditioning
                name: Klimaat
                icon: mdi:air-conditioner
                color: cyan
              - type: tile
                card_mod: *tile
                entity: sensor.oprit_508_sw_mileage
                name: Km-stand
                icon: mdi:counter
                color: grey
              - type: tile
                card_mod: *tile
                entity: sensor.oprit_508_sw_temperature
                name: Buiten
                icon: mdi:thermometer
                color: red

      # ---- Bediening (alleen ondersteunde commando's) --------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Bediening
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:decluttering-card
                template: command_button
                variables:
                  - name: Wakker
                  - icon: mdi:car-connected
                  - color: blue
                  - entity: button.oprit_508_sw_wakeup
              - type: custom:decluttering-card
                template: command_button
                variables:
                  - name: Laden start
                  - icon: mdi:play
                  - color: green
                  - entity: button.oprit_508_sw_charge_start
              - type: custom:decluttering-card
                template: command_button
                variables:
                  - name: Laden stop
                  - icon: mdi:stop
                  - color: red
                  - entity: button.oprit_508_sw_charge_stop
              - type: custom:decluttering-card
                template: command_button
                variables:
                  - name: Klimaat aan
                  - icon: mdi:air-conditioner
                  - color: blue
                  - entity: button.oprit_508_sw_preconditioning_start
              - type: custom:decluttering-card
                template: command_button
                variables:
                  - name: Klimaat uit
                  - icon: mdi:hvac-off
                  - color: grey
                  - entity: button.oprit_508_sw_preconditioning_stop

      # ---- Rit & motor ---------------------------------------------------
      - type: entities
        title: Rit & motor
        card_mod: *cm
        entities:
          - entity: sensor.oprit_508_sw_last_trip
            name: Laatste rit
          - entity: sensor.oprit_508_sw_coolant_temperature
            name: Koelvloeistof
          - entity: sensor.oprit_508_sw_oil_temperature
            name: Olie
          - entity: sensor.oprit_508_sw_service_battery
            name: Startaccu

      # ---- Accugezondheid & laden ----------------------------------------
      - type: entities
        title: Accu & laden
        card_mod: *cm
        entities:
          - entity: sensor.oprit_508_sw_battery_charging_rate
            name: Laadsnelheid
          - entity: sensor.oprit_508_sw_battery_charging_end
            name: Klaar om
          - entity: sensor.oprit_508_sw_last_charge
            name: Laatste laadbeurt
          - entity: switch.oprit_508_sw_battery_charging_limit
