                color: green
              - type: tile
                card_mod: *tile
                entity: sensor.alfen_jk_real_power_sum
                name: Vermogen
                icon: mdi:flash
                color: amber
              - type: tile
                card_mod: *tile
                entity: sensor.alfen_jk_current_session_wh
                name: Sessie
                icon: mdi:counter
