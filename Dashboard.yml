            type: column
            group_by:
              func: max
              duration: 1d
          - entity: sensor.wazuh_medium_24h
            name: Middel
            type: column
            group_by:
              func: max
              duration: 1d
          - entity: sensor.wazuh_low_24h
            name: Laag
            type: column
            group_by:
