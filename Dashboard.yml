  # ===================================================================
  #  7 · GEZONDHEID (Garmin)
  # ===================================================================
  - title: Gezondheid
    path: health
    icon: mdi:heart-pulse
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr))
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      align-items: stretch
    cards:
      # ---- Vandaag (tegels; stappen bewust minder prominent) -------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Vandaag
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
                entity: sensor.total_steps
                name: Stappen
                icon: mdi:shoe-print
                color: grey
              - type: tile
                card_mod: *tile
                entity: sensor.garmin_connect_intensity_minutes
                name: Intensiteit
                icon: mdi:run-fast
                color: green
              - type: tile
                card_mod: *tile
                entity: sensor.active_kilocalories
                name: Calorieën
                icon: mdi:fire
                color: deep-orange
              - type: tile
                card_mod: *tile
                entity: sensor.floors_ascended
                name: Verdiepingen
                icon: mdi:stairs-up
                color: teal
              - type: tile
                card_mod: *tile
                entity: sensor.body_battery_most_recent
                name: Body Battery
                icon: mdi:battery-heart-variant
                color: green
              - type: tile
                card_mod: *tile
                entity: sensor.avg_stress_level
                name: Stress
                icon: mdi:emoticon-neutral
                color: amber
              - type: tile
                card_mod: *tile
                entity: sensor.average_spo2
                name: SpO₂
                icon: mdi:lungs
                color: cyan
              - type: tile
                card_mod: *tile
                entity: sensor.resting_heart_rate
                name: Rusthartslag
                icon: mdi:heart-pulse
                color: red

      # ---- Training & herstel (tegels) -----------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Training & herstel
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
                entity: sensor.garmin_connect_training_readiness
                name: Gereedheid
                icon: mdi:arm-flex
                color: green
              - type: tile
