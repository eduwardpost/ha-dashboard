      # ---- Live laden (conditioneel) -------------------------------------
      - type: conditional
        conditions:
          - entity: binary_sensor.oprit_508_sw_battery_plugged
            state: 'on'
        card:
          type: custom:apexcharts-card
          view_layout:
            grid-column: 1 / -1
          card_mod: *cm
          header:
            show: true
            title: Laden nu
            show_states: true
            colorize_states: true
          graph_span: 3h
          series:
            - entity: sensor.alfen_jk_real_power_sum
              transform: 'return x / 1000;'
              name: Laadvermogen
              group_by:
                func: avg
                duration: 5min

