# =====================================================================
#  Woning-dashboard — FROM SCRATCH build (2026) — iteratie 3
#  Uitsluitend gebouwd op basis van entities.jsonc (geen verzonnen entiteiten).
#  Stijl: Catppuccin (auto latte/mocha) — kaartranden via theme-variabelen.
#  DECLUTTER: chip-rijen vervangen door nette `tile`-rasters (rustiger beeld);
#             alleen de bovenste statusbalk blijft chips.
#  Woning-view = één blok per kamer met licht/klimaat/media van die ruimte.
#  Layout: layout-card responsive auto-fit grid (minmax(min(100%,340px),1fr)).
#  Weergaven: Overzicht · Woning · Energie · Auto · Beveiliging · Homelab · Gezondheid
#  Padnamen blijven Engels zodat interne navigatie werkt; titels zijn Nederlands.
# =====================================================================
title: Woning

decluttering_templates:
  # Opdrachttegel die een button.press aanroept (auto-commando's e.d.)
  command_button:
    card:
      type: custom:mushroom-template-card
      card_mod: &tile
        style: |
          ha-card {
            border-radius: 22px;
            border: 0px;
            box-shadow: none;
          }
      primary: '[[name]]'
      icon: '[[icon]]'
      icon_color: '[[color]]'
      layout: vertical
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: '[[entity]]'

views:
  # ===================================================================
  #  1 · OVERZICHT  (geen verlichting — die schakelt automatisch)
  # ===================================================================
  - title: Overzicht
    path: overview
    icon: mdi:view-dashboard
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr))
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      align-items: stretch
    cards:
      # ---- Statusbalk (volledige breedte, enige chip-rij) ----------------
      - type: custom:mushroom-chips-card
        alignment: center
        view_layout:
          grid-column: 1 / -1
        chips:
          - type: template
            icon: mdi:home-account
            content: >
              {% if is_state('group.persons','home') %}Thuis{% else %}Weg{% endif %}
            icon_color: >
              {% if is_state('group.persons','home') %}green{% else %}amber{% endif %}
            tap_action:
              action: more-info
              entity: group.persons
          - type: template
            icon: mdi:shield-home
            content: >
              {% if states('alarm_control_panel.alarm').startswith('armed') %}Aan{% else %}Uit{% endif %}
            icon_color: >
              {% if states('alarm_control_panel.alarm').startswith('armed') %}green{% else %}red{% endif %}
            tap_action:
              action: more-info
              entity: alarm_control_panel.alarm
          - type: template
            icon: mdi:lock
            content: >
              {% if is_state('lock.elite','locked') %}Dicht{% else %}Open{% endif %}
            icon_color: >
              {% if is_state('lock.elite','locked') %}green{% else %}red{% endif %}
            tap_action:
              action: more-info
              entity: lock.elite
          - type: template
            icon: mdi:solar-power-variant
            content: '{{ (states("sensor.inverter_total_power")|float(0)/1000)|round(2) }} kW'
            icon_color: amber
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/energy
          - type: template
            icon: mdi:transmission-tower
            content: '{{ states("sensor.electricity_meter_power_consumption") }} kW'
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/energy
          - type: template
            icon: mdi:car-electric
            content: '{{ states("sensor.oprit_508_sw_battery") }}%'
            icon_color: >
              {% if states('sensor.oprit_508_sw_battery')|int(0) > 50 %}green{% else %}amber{% endif %}
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/car
          - type: template
            icon: mdi:robot-vacuum
            content: '{{ states("vacuum.roombot") }}'
            icon_color: >
              {% if is_state('vacuum.roombot','cleaning') %}blue{% else %}grey{% endif %}
            tap_action:
              action: more-info
              entity: vacuum.roombot
          - type: template
            icon: mdi:speedometer
            content: '{{ states("sensor.speedtest_download")|round(0) }}↓'
            icon_color: teal
            tap_action:
              action: navigate
              navigation_path: /ha-dashboard/homelab

      # ---- Weer -----------------------------------------------------------
      - type: weather-forecast
        entity: weather.forecast_home
        show_current: true
        show_forecast: true
        forecast_type: daily

      # ---- Energie (tegels i.p.v. chips) ---------------------------------
      - type: custom:stack-in-card
        card_mod: &cm
          style: |
            ha-card {
              border-radius: var(--ha-card-border-radius, 18px);
              border: 1px solid var(--divider-color);
              box-shadow: none;
              height: 100%;
              box-sizing: border-box;
            }
        cards:
          - type: custom:mushroom-title-card
            title: Energie
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
                entity: sensor.inverter_total_power
                name: Zon nu
                icon: mdi:solar-power
                color: amber
              - type: tile
                card_mod: *tile
                entity: sensor.electricity_meter_power_consumption
                name: Van net
                icon: mdi:transmission-tower-import
                color: blue
              - type: tile
                card_mod: *tile
                entity: sensor.electricity_meter_power_production
                name: Terug
                icon: mdi:transmission-tower-export
                color: green
              - type: tile
                card_mod: *tile
                entity: sensor.alfen_jk_car_charging
                name: Laadpaal
                icon: mdi:ev-station
                color: teal

      # ---- Klimaat --------------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Klimaat
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
                entity: sensor.multisensor_6_air_temperature
                name: Woonkamer
                icon: mdi:sofa
                color: red
              - type: tile
                card_mod: *tile
                entity: sensor.multisensor_6_humidity
                name: Vocht
                icon: mdi:water-percent
                color: blue
              - type: tile
                card_mod: *tile
                entity: sensor.multisensor_6_carbon_dioxide_co2_level
                name: CO₂
                icon: mdi:molecule-co2
                color: green
              - type: tile
                card_mod: *tile
                entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_temperature
                name: Slaapkamer
                icon: mdi:bed
                color: red

      # ---- Beveiliging ----------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Beveiliging
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
                entity: binary_sensor.frontdoor_open
                name: Voordeur
                icon: mdi:door
                color: blue
              - type: tile
                card_mod: *tile
                entity: binary_sensor.front_door_motion
                name: Beweging
                icon: mdi:motion-sensor
                color: amber
              - type: tile
                card_mod: *tile
                entity: sensor.siem_security_score
                name: SIEM-score
                icon: mdi:shield-check
                color: green
              - type: tile
                card_mod: *tile
                entity: sensor.wazuh_critical_24h
                name: Kritiek 24u
                icon: mdi:alert-octagon
                color: red

      # ---- Vandaag: afval, zon, pollen -----------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Vandaag
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
                entity: sensor.afvalinfo_thuis_trash_type_today
                name: Afval nu
                icon: mdi:trash-can
                color: brown
              - type: tile
                card_mod: *tile
                entity: sensor.afvalinfo_thuis_trash_type_tomorrow
                name: Afval morgen
                icon: mdi:trash-can-outline
                color: brown
              - type: tile
                card_mod: *tile
                entity: sensor.sun_next_rising
                name: Zon op
                icon: mdi:weather-sunset-up
                color: amber
              - type: tile
                card_mod: *tile
                entity: sensor.sun_next_setting
                name: Zon onder
                icon: mdi:weather-sunset-down
                color: deep-orange
              - type: tile
                card_mod: *tile
                entity: sensor.kleenex_pollen_radar_home_trees_level
                name: Pollen bomen
                icon: mdi:tree
                color: green
              - type: tile
                card_mod: *tile
                entity: sensor.kleenex_pollen_radar_home_grass_level
                name: Pollen gras
                icon: mdi:grass
                color: light-green

      # ---- Actieve media --------------------------------------------------
      - type: custom:auto-entities
        card:
          type: custom:stack-in-card
          card_mod: *cm
        card_param: cards
        filter:
          include:
            - domain: media_player
              state: playing
              options:
                type: custom:mushroom-media-player-card
                use_media_info: true
                media_controls:
                  - play_pause_stop
                  - next
                volume_controls:
                  - volume_buttons
          exclude: []
        sort:
          method: friendly_name
        show_empty: true

      # ---- Agenda ---------------------------------------------------------
      - type: custom:calendar-card-pro
        title: Agenda
        entities:
          - calendar.persoonlijk
          - calendar.kyokushin_karate
          - calendar.afvalinfo_thuis_calendar
          - calendar.radarr

      # ---- Energie vandaag (grafiek, volle breedte) ----------------------
      - type: custom:apexcharts-card
        view_layout:
          grid-column: 1 / -1
        card_mod: *cm
        header:
          show: true
          title: Energie vandaag
          show_states: true
          colorize_states: true
        graph_span: 24h
        series:
          - entity: sensor.inverter_total_power
            transform: 'return x / 1000;'
            name: Zon
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.electricity_meter_power_consumption
            name: Import
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.electricity_meter_power_production
            name: Export
            group_by:
              func: avg
              duration: 10min

  # ===================================================================
  #  2 · WONING  (één blok per kamer)
  # ===================================================================
  - title: Woning
    path: home
    icon: mdi:home-variant
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr))
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      align-items: stretch
    cards:
      # ---- Woonkamer -----------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Woonkamer
          - type: tile
            card_mod: *tile
            entity: light.living_room_lights
            name: Plafond
            icon: mdi:sofa
            features:
              - type: light-brightness
          - type: tile
            card_mod: *tile
            entity: light.schilderij
            name: Schilderij
            icon: mdi:image-frame
            features:
              - type: light-brightness
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
                entity: sensor.multisensor_6_air_temperature
                name: Temp
                icon: mdi:thermometer
                color: red
              - type: tile
                card_mod: *tile
                entity: sensor.multisensor_6_humidity
                name: Vocht
                icon: mdi:water-percent
                color: blue
              - type: tile
                card_mod: *tile
                entity: sensor.multisensor_6_carbon_dioxide_co2_level
                name: CO₂
                icon: mdi:molecule-co2
                color: green
              - type: tile
                card_mod: *tile
                entity: binary_sensor.multisensor_6_motion_detection
                name: Beweging
                icon: mdi:motion-sensor
                color: amber
          - type: custom:mushroom-media-player-card
            card_mod: *tile
            entity: media_player.tv_samsung_7_series_55
            name: TV
            use_media_info: true

      # ---- Keuken --------------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Keuken
          - type: tile
            card_mod: *tile
            entity: light.kitchen_lights
            name: Keuken
            icon: mdi:countertop
            features:
              - type: light-brightness
          - type: tile
            card_mod: *tile
            entity: light.keuken_boven
            name: Bovenkastjes
            icon: mdi:led-strip-variant
            features:
              - type: light-brightness
          - type: custom:mushroom-media-player-card
            card_mod: *tile
            entity: media_player.keuken_speaker
            name: Speaker
            use_media_info: true

      # ---- Eetkamer ------------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Eetkamer
          - type: tile
            card_mod: *tile
            entity: light.eetkamer
            name: Eettafel
            icon: mdi:table-chair
            features:
              - type: light-brightness

      # ---- Hal & overloop ------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Hal & overloop
          - type: tile
            card_mod: *tile
            entity: light.hal
            name: Hal
            icon: mdi:coat-rack
            features:
              - type: light-brightness
          - type: tile
            card_mod: *tile
            entity: light.downstairs
            name: Beneden
            icon: mdi:stairs
            features:
              - type: light-brightness

      # ---- Kantoor -------------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Kantoor
          - type: tile
            card_mod: *tile
            entity: light.kantoor
            name: Kantoor
            icon: mdi:desk
            features:
              - type: light-brightness
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
                entity: sensor.kantoor_power_switch_electric_consumption_w_2
                name: Verbruik
                icon: mdi:flash
                color: yellow
              - type: tile
                card_mod: *tile
                entity: media_player.office_speaker
                name: Speaker
                icon: mdi:speaker
                color: indigo
          - type: custom:mushroom-media-player-card
            card_mod: *tile
            entity: media_player.office_speaker
            name: Speaker
            use_media_info: true

      # ---- Slaapkamer ----------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Slaapkamer
          - type: tile
            card_mod: *tile
            entity: light.slaapkamer_plafond
            name: Plafond
            icon: mdi:ceiling-light
            features:
              - type: light-brightness
          - type: tile
            card_mod: *tile
            entity: light.slaapkamer_hoek
            name: Hoeklamp
            icon: mdi:floor-lamp
            features:
              - type: light-brightness
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
                entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_temperature
                name: Temp
                icon: mdi:thermometer
                color: red
              - type: tile
                card_mod: *tile
                entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_humidity
                name: Vocht
                icon: mdi:water-percent
                color: blue
              - type: tile
                card_mod: *tile
                entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_carbon_dioxide
                name: CO₂
                icon: mdi:molecule-co2
                color: green
              - type: tile
                card_mod: *tile
                entity: binary_sensor.slaapkamer_beweging_occupancy
                name: Beweging
                icon: mdi:motion-sensor
                color: amber
          - type: custom:mushroom-media-player-card
            card_mod: *tile
            entity: media_player.bedroom
            name: Slaapkamer
            use_media_info: true

      # ---- Buiten & stekkers ---------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Buiten & stekkers
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
                entity: light.buiten_lampen_oprit
                name: Oprit
                icon: mdi:coach-lamp
                color: amber
              - type: tile
                card_mod: *tile
                entity: light.buiten_lampen_garage
                name: Garage
                icon: mdi:coach-lamp
                color: amber
              - type: tile
                card_mod: *tile
                entity: switch.buiten_stekker
                name: Stekker buiten
                icon: mdi:power-socket-eu
                color: blue
              - type: tile
                card_mod: *tile
                entity: switch.kerst_stekker_4
                name: Kerstverlichting
                icon: mdi:string-lights
                color: green

      # ---- Roombot -------------------------------------------------------
      - type: custom:stack-in-card
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Roombot
          - type: custom:mushroom-vacuum-card
            entity: vacuum.roombot
            icon: mdi:robot-vacuum
            commands:
              - start
              - pause
              - stop
              - return_home
              - locate
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
                entity: sensor.roombot_battery_level
                name: Accu
                icon: mdi:battery
                color: green
              - type: tile
                card_mod: *tile
                entity: sensor.roombot_total_missions
                name: Beurten
                icon: mdi:counter
                color: blue

      # ---- Klimaattrend (grafiek, volle breedte) -------------------------
      - type: custom:apexcharts-card
        view_layout:
          grid-column: 1 / -1
        card_mod: *cm
        header:
          show: true
          title: Klimaattrend (24u)
          show_states: true
          colorize_states: true
        graph_span: 24h
        yaxis:
          - id: temp
            decimals: 1
            apex_config:
              title:
                text: °C
          - id: co2
            opposite: true
            apex_config:
              title:
                text: ppm
        series:
          - entity: sensor.multisensor_6_air_temperature
            name: Woonkamer
            yaxis_id: temp
            group_by:
              func: avg
              duration: 15min
          - entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_temperature
            name: Slaapkamer
            yaxis_id: temp
            group_by:
              func: avg
              duration: 15min
          - entity: sensor.slaapkamer_slaapkamer_luchtkwaliteit_meter_carbon_dioxide
            name: CO₂
            yaxis_id: co2
            group_by:
              func: avg
              duration: 15min

  # ===================================================================
  #  3 · ENERGIE
  # ===================================================================
  - title: Energie
    path: energy
    icon: mdi:lightning-bolt
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(4, 1fr)
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      align-items: stretch
    cards:
      # ---- Energiestroom (verdeling) — fossil% verwijderd zodat de vier
      #      verbruikers (Laadpaal/Kantoor/Servers/Netwerk) blijven passen.
      - type: custom:power-flow-card-plus
        title: Huidig verbruik
        view_layout:
          grid-column: 1 / 3
        card_mod: *cm
        entities:
          grid:
            entity:
              consumption: sensor.electricity_meter_power_consumption
              production: sensor.electricity_meter_power_production
            color_circle: true
            display_state: two_way
            color_value: true
            color_icon: true
          solar:
            entity: sensor.inverter_total_power
            color_icon: true
          home:
            color_icon: true
          individual:
            - entity: sensor.alfen_jk_real_power_sum
              name: Laadpaal
              icon: mdi:ev-station
              color_icon: true
              calculate_flow_rate: true
            - entity: sensor.kantoor_power_switch_electric_consumption_w_2
              name: Kantoor
              icon: mdi:office-building
              color_icon: true
              calculate_flow_rate: true
            - entity: sensor.zolder_power_switch_power_2
              name: Servers
              icon: mdi:server
              color_icon: true
              calculate_flow_rate: true
            - entity: sensor.meterkast_power_switch_electric_consumption_w
              name: Netwerk
              icon: mdi:access-point-network
              color_icon: true
              calculate_flow_rate: true
        clickable_entities: true
        display_zero_lines:
          mode: show
          transparency: 50
          grey_color:
            - 189
            - 189
            - 189
        use_new_flow_rate_model: true
        w_decimals: 0
        kw_decimals: 1
        min_flow_rate: 0.75
        max_flow_rate: 6
        max_expected_power: 3000
        min_expected_power: 0.01
        watt_threshold: 1000
        transparency_zero_lines: 0

      # ---- Zon & opbrengst (tegels) --------------------------------------
      - type: custom:stack-in-card
        view_layout:
          grid-column: 3 / 4
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Zon & opbrengst
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
                entity: sensor.inverter_voor
                name: Nu voor
                icon: mdi:solar-panel
                color: amber
              - type: tile
                card_mod: *tile
                entity: sensor.inverter_achter
                name: Nu achter
                icon: mdi:solar-panel-large
                color: amber
              - type: tile
                card_mod: *tile
                entity: sensor.inverter_voor_energy_today
                name: Vandaag voor
                icon: mdi:white-balance-sunny
                color: orange
              - type: tile
                card_mod: *tile
                entity: sensor.inverter_achter_energy_today
                name: Vandaag achter
                icon: mdi:white-balance-sunny
                color: orange
              - type: tile
                card_mod: *tile
                entity: sensor.inverter_voor_income_today
                name: Opbrengst voor
                icon: mdi:cash
                color: green
              - type: tile
                card_mod: *tile
                entity: sensor.inverter_achter_income_today
                name: Opbrengst achter
                icon: mdi:cash
                color: green

      # ---- Meterstanden (nette lijst) ------------------------------------
      - type: entities
        title: Meterstanden
        view_layout:
          grid-column: 4 / 5
        card_mod: *cm
        entities:
          - entity: sensor.electricity_meter_energy_consumption_tarif_1
            name: Verbruik dal
          - entity: sensor.electricity_meter_energy_consumption_tarif_2
            name: Verbruik normaal
          - entity: sensor.electricity_meter_energy_production_tarif_1
            name: Teruglevering dal
          - entity: sensor.electricity_meter_energy_production_tarif_2
            name: Teruglevering normaal
          - entity: sensor.electricity_meter_active_tariff
            name: Actief tarief
          - entity: sensor.gas_meter_gas_consumption
            name: Gas totaal

      # ---- Laadpaal (Alfen) ----------------------------------------------
      - type: custom:stack-in-card
        view_layout:
          grid-column: 1 / 3
        card_mod: *cm
        cards:
          - type: custom:mushroom-title-card
            title: Laadpaal
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                card_mod: *tile
